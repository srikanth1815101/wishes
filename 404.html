<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Friendship Day Wishes</title>
  <script>
    (function() {
      const path = window.location.pathname;
      const parts = path.split('/').filter(Boolean);
      if (parts.length >= 2 && parts[0] === 'friendship-day') {
        fetch('/friendship-day/index.html')
          .then(res => {
            if (!res.ok) throw new Error();
            return res.text();
          })
          .then(html => {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(() => {
            window.location.replace('/friendship-day/');
          });
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 60px; color: #888;">
  <p>Loading your wish surprise...</p>
</body>
</html>
