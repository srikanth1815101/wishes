  <script>
    // ═══════════════════════════════════════════════════════════
    // 1. DATA & UTILITIES (XOR + Base64URL Token Engine)
    // ═══════════════════════════════════════════════════════════
    const SECRET = 'friendship-day-2026-csrgo';

    function xorTransform(input) {
      let out = '';
      for (let i = 0; i < input.length; i++) {
        out += String.fromCharCode(input.charCodeAt(i) ^ SECRET.charCodeAt(i % SECRET.length));
      }
      return out;
    }

    function toBase64Url(str) {
      const utf8 = unescape(encodeURIComponent(str));
      let binary = '';
      for (let i = 0; i < utf8.length; i++) {
        binary += String.fromCharCode(utf8.charCodeAt(i));
      }
      const b64 = btoa(binary);
      return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function fromBase64Url(str) {
      const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
      const binary = atob(b64 + pad);
      let utf8 = '';
      for (let i = 0; i < binary.length; i++) {
        utf8 += String.fromCharCode(binary.charCodeAt(i));
      }
      return decodeURIComponent(escape(utf8));
    }

    function encodeWishes(payload) {
      const json = JSON.stringify(payload);
      return toBase64Url(xorTransform(json));
    }

    function decodeWishes(token) {
      try {
        const json = xorTransform(fromBase64Url(token));
        const parsed = JSON.parse(json);
        if (typeof parsed.u !== 'string' || typeof parsed.f !== 'string' || typeof parsed.m !== 'string') {
          return null;
        }
        return parsed;
      } catch {
        return null;
      }
    }

    function toTitleCase(str) {
      if (typeof str !== 'string') return '';
      return str
        .trim()
        .toLowerCase()
        .split(/\s+/)
        .map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : '')
        .join(' ');
    }

    function slugifyName(name) {
      return (name || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'friend';
    }

    function buildWishesUrl(origin, userName, friendName, token) {
      const u = slugifyName(userName);
      const f = slugifyName(friendName);
      const base = origin.replace(/\/+$/, '');
      return `${base}/friendship-day/${u}-${f}/${token}`;
    }

    function getFriendshipImage(payload) {
      if (!payload) return '/friendship-day/images/friends_mf.png';
      const ug = (payload.ug || 'm').toLowerCase();
      const fg = (payload.fg || 'f').toLowerCase();

      if (ug === 'm' && fg === 'm') {
        return '/friendship-day/images/friends_mm.png';
      }
      if (ug === 'f' && fg === 'f') {
        return '/friendship-day/images/friends_ff.png';
      }
      return '/friendship-day/images/friends_mf.png';
    }

    // ═══════════════════════════════════════════════════════════
    // 2. CONFETTI & BACKGROUND ENGINE
    // ═══════════════════════════════════════════════════════════
    class ConfettiEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.animate();
      }

      resize() {
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = window.innerWidth * dpr;
        this.canvas.height = window.innerHeight * dpr;
        this.canvas.style.width = `${window.innerWidth}px`;
        this.canvas.style.height = `${window.innerHeight}px`;
        this.ctx.scale(dpr, dpr);
      }

      fire() {
        const colors = ['#fb7185', '#f43f5e', '#fb923c', '#facc15', '#a78bfa', '#34d399', '#60a5fa', '#f472b6'];
        const shapes = ['rect', 'circle', 'heart'];
        const count = 140;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
          const speed = 4 + Math.random() * 9;
          this.particles.push({
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 4,
            size: 6 + Math.random() * 10,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - 0.5) * 0.3,
            shape: shapes[Math.floor(Math.random() * shapes.length)],
            life: 120 + Math.random() * 80
          });
        }
      }

      drawHeart(x, y, size) {
        const ctx = this.ctx;
        ctx.beginPath();
        const s = size / 2;
        ctx.moveTo(x, y + s * 0.3);
        ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.3);
        ctx.bezierCurveTo(x - s, y + s * 0.7, x, y + s, x, y + s * 1.1);
        ctx.bezierCurveTo(x, y + s, x + s, y + s * 0.7, x + s, y + s * 0.3);
        ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
        ctx.fill();
      }

      animate() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.12;
          p.vx *= 0.99;
          p.rotation += p.rotationSpeed;
          p.life -= 1;

          if (p.y > window.innerHeight + 40 || p.life <= 0) {
            this.particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = Math.min(1, p.life / 60);
          ctx.fillStyle = p.color;
          if (p.shape === 'rect') {
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          } else if (p.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            this.drawHeart(0, 0, p.size);
          }
          ctx.restore();
        }
        requestAnimationFrame(() => this.animate());
      }
    }

    let confettiInstance = null;

    function initFloatingEmojis() {
      const container = document.getElementById('floating-emojis');
      if (!container) return;
      container.innerHTML = '';

      const EMOJIS = ['💖', '🌟', '🎈', '🌸', '🦋', '💫', '🎀', '🧁', '🌈', '✨', '💕', '🌷', '🥳', '💌', '🌻', '⭐'];

      // Fisher-Yates Shuffle for unique emoji placement
      for (let i = EMOJIS.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [EMOJIS[i], EMOJIS[j]] = [EMOJIS[j], EMOJIS[i]];
      }

      // 16 Evenly Spaced Columns popping from bottom
      const count = 16;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        const emoji = EMOJIS[i % EMOJIS.length];

        const left = 3 + (i / count) * 92 + (Math.random() * 3 - 1.5);
        const duration = 14 + Math.random() * 12;
        const delay = -(Math.random() * duration);
        const size = 18 + Math.random() * 16;

        el.className = 'fixed bottom-[-60px] pointer-events-none';
        el.style.left = `${left}%`;
        el.style.fontSize = `${size}px`;
        el.style.animation = `float-up ${duration}s linear ${delay}s infinite`;
        el.textContent = emoji;
        container.appendChild(el);
      }
    }

    function spawnFloatingHearts() {
      const overlay = document.getElementById('hearts-overlay');
      if (!overlay) return;
      for (let i = 0; i < 10; i++) {
        const span = document.createElement('span');
        span.className = 'absolute bottom-0 text-3xl text-rose-400';
        span.style.left = `${5 + Math.random() * 90}%`;
        span.style.animation = 'float-up 2.5s ease-out forwards';
        span.innerHTML = `<i data-lucide="heart" class="h-7 w-7 text-rose-400 fill-current"></i>`;
        overlay.appendChild(span);
        setTimeout(() => span.remove(), 2500);
      }
      if (window.lucide) lucide.createIcons();
    }

    function triggerCelebration() {
      if (confettiInstance) confettiInstance.fire();
      spawnFloatingHearts();

      state.userGender = g;

        btnF.className = `flex-1 sm:flex-none rounded-lg px-3 py-1.5 text-xs font-semibold transition ${g === 'f' ? 'bg-rose-500 text-white shadow-sm' : 'text-rose-500 hover:bg-rose-100'}`;
      }

    function setFriendGender(g) {
      state.friendGender = g;
      const btnM = document.getElementById('btn-fg-m');
      const btnF = document.getElementById('btn-fg-f');
      if (btnM && btnF) {
        btnM.className = `flex-1 sm:flex-none rounded-lg px-3 py-1.5 text-xs font-semibold transition ${g === 'm' ? 'bg-rose-500 text-white shadow-sm' : 'text-rose-500 hover:bg-rose-100'}`;
        btnF.className = `flex-1 sm:flex-none rounded-lg px-3 py-1.5 text-xs font-semibold transition ${g === 'f' ? 'bg-rose-500 text-white shadow-sm' : 'text-rose-500 hover:bg-rose-100'}`;
      }
    }

    function parseAppRoute() {
      const pathname = window.location.pathname;
      const hash = window.location.hash;
      const params = new URLSearchParams(window.location.search);

      let candidates = [];

      // 1. From Hash: #/username-friendname/token or #token
      if (hash) {
        const hashClean = hash.replace(/^#\/?/, '');
        const hashParts = hashClean.split('/').filter(Boolean);
        if (hashParts.length > 0) {
          candidates.push(hashParts[hashParts.length - 1]);
        }
      }

      // 2. From Path: /friendship-day/username-friendname/token
      const pathParts = pathname.split('/').filter(Boolean);
      if (pathParts.length >= 3 && pathParts[0] === 'friendship-day') {
        candidates.push(pathParts[pathParts.length - 1]);
      } else if (pathParts.length >= 2 && pathParts[0] !== 'friendship-day') {
        candidates.push(pathParts[pathParts.length - 1]);
      }

      // 3. From Query Param: ?token=...
      if (params.get('token')) {
        candidates.push(params.get('token'));
      }

      for (const token of candidates) {
        if (!token) continue;
        const decoded = decodeWishes(token);
        if (decoded) {
          state.view = 'reveal';
          state.token = token;
          state.payload = decoded;
          return;
        }
      }
      state.view = 'create';
    }

    function updateCharCount() {
      const msg = document.getElementById('input-message');
      const counter = document.getElementById('char-count');
      if (msg && counter) {
        counter.textContent = `${msg.value.length}/280`;
      }
    }

    function handleCreateSubmit(e) {
      e.preventDefault();
      const rawUserName = document.getElementById('input-username').value;
      const rawFriendName = document.getElementById('input-friendname').value;
      const userName = toTitleCase(rawUserName);
      const friendName = toTitleCase(rawFriendName);
      const message = document.getElementById('input-message').value.trim();
      const errBox = document.getElementById('form-error');

      if (!userName || !friendName || !message) {
        if (errBox) {
          errBox.textContent = 'Please fill in all three fields to create your wish.';
          errBox.classList.remove('hidden');
        }
        return;
      }
      if (errBox) errBox.classList.add('hidden');

      const payload = {
        u: userName,
        ug: state.userGender || 'm',
        f: friendName,
        fg: state.friendGender || 'f',
        m: message,
        t: Date.now()
      };
      const token = encodeWishes(payload);
      const url = buildWishesUrl(window.location.origin, userName, friendName, token);

      const resBox = document.getElementById('result-box');
      const urlBox = document.getElementById('generated-url');
      if (resBox && urlBox) {
        urlBox.textContent = url;
        resBox.classList.remove('hidden');
        resBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    async function copyWishUrl() {
      const urlBox = document.getElementById('generated-url');
      const copyBtn = document.getElementById('copy-btn');
      if (!urlBox) return;
      try {
        await navigator.clipboard.writeText(urlBox.textContent);
        if (copyBtn) {
          copyBtn.innerHTML = `<i data-lucide="check" class="h-4 w-4 text-green-500"></i> Copied!`;
          if (window.lucide) lucide.createIcons();
          setTimeout(() => {
            copyBtn.innerHTML = `<i data-lucide="copy" class="h-4 w-4"></i> Copy link`;
            if (window.lucide) lucide.createIcons();
          }, 2200);
        }
      } catch (e) {
        alert('Could not copy automatically — please select and copy the link text.');
      }
    }

    function previewWishUrl() {
      const urlBox = document.getElementById('generated-url');
      if (urlBox) {
        window.open(urlBox.textContent, '_blank');
      }
    }

                  <g clip-path="url(#heart-meter-clip)">
                    <g id="meter-liquid-group" style="transform: translateY(${90 - (state.meterLevel / 100) * 95}px); transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);">
                      <path class="animate-wave-back" d="M -120 0 Q -100 -8, -80 0 T -40 0 T 0 0 T 40 0 T 80 0 T 120 0 T 160 0 T 200 0 T 240 0 L 240 140 L -120 140 Z" fill="#fda4af" opacity="0.6" />
                      <path class="animate-wave-front" d="M -120 0 Q -100 8, -80 0 T -40 0 T 0 0 T 40 0 T 80 0 T 120 0 T 160 0 T 200 0 T 240 0 L 240 140 L -120 140 Z" fill="url(#heartLiquidGrad)" opacity="0.95" />
                      <circle cx="20" cy="35" r="3.5" fill="#ffffff" opacity="0.7" class="animate-bubble-1" />
                      <circle cx="50" cy="55" r="4.5" fill="#ffffff" opacity="0.8" class="animate-bubble-2" />
                      <circle cx="78" cy="25" r="3" fill="#ffffff" opacity="0.6" class="animate-bubble-3" />
                    </g>
                  </g>

                  <path d="M 50,85 C 10,55 0,35 0,22 C 0,9 10,0 25,0 C 35,0 45,6 50,15 C 55,6 65,0 75,0 C 90,0 100,9 100,22 C 100,35 90,55 50,85 Z" fill="none" stroke="#fb7185" stroke-width="3.5" />

                  <text id="meter-percent-text" x="50" y="46" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#ffffff" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));">${Math.round(state.meterLevel)}%</text>
                </svg>
              </div>

              <!-- Shuffled Wish Message Card inside Meter -->
              <div id="meter-wish-box" class="w-full rounded-2xl border border-rose-100 bg-white/80 p-3.5 text-center glass shadow-sm transition-all duration-300 ${state.meterLevel > 0 ? 'animate-pop-in' : 'hidden'}">
                <div class="flex items-center justify-center gap-2">
                  <span id="meter-wish-emoji" class="text-2xl animate-bounce-soft">${currentWish ? currentWish.emoji : '💖'}</span>
                  <p id="meter-wish-text" class="text-sm font-medium text-gray-700 leading-snug">${currentWish ? currentWish.text : 'Pour love to reveal wishes!'}</p>
                </div>
              </div>
            </div>

            <button id="pour-love-btn" onclick="pourLove(event)" ${isFull ? 'disabled' : ''} class="no-select flex items-center justify-center gap-2 rounded-2xl py-4 text-base font-semibold text-white shadow-lg transition active:scale-[0.97] ${isFull ? 'bg-green-400 shadow-green-200/50' : 'bg-gradient-to-r from-rose-500 to-orange-500 shadow-rose-300/50'}">
              ${isFull ? `<i data-lucide="check" class="h-5 w-5"></i> Full!` : `<i data-lucide="flame" class="h-5 w-5"></i> Pour some love`}
            </button>
          </div>
        `;
      } else if (state.revealStage === 'revealed') {
        const friendImg = getFriendshipImage(p);
        html += `
          <div class="my-auto flex flex-1 flex-col justify-center animate-fade-in-up py-4">
            <!-- Header Badge & Title -->
            <div class="mb-4 flex flex-col items-center text-center">
              <span class="inline-flex items-center gap-1.5 rounded-full bg-rose-100/90 px-3.5 py-1 text-xs font-bold uppercase tracking-widest text-rose-500 shadow-sm border border-rose-200/60">
                <i data-lucide="sparkles" class="h-3.5 w-3.5 text-rose-500"></i> Friendship Day ${new Date().getFullYear()}
              </span>
              <h1 class="mt-2 text-3xl font-black shimmer-text leading-tight">Happy Friendship Day!</h1>
            </div>

            <!-- Main Premium Hero Card -->
            <div class="relative overflow-hidden rounded-[2.5rem] border border-white/80 bg-gradient-to-b from-white/95 via-rose-50/70 to-orange-50/60 p-6 card-premium shadow-2xl backdrop-blur-md">
              <div class="absolute -top-10 left-1/2 -translate-x-1/2 h-44 w-44 rounded-full bg-rose-300/40 blur-3xl pointer-events-none"></div>

              <!-- Hands Tying Friendship Band Illustration -->
              <div class="relative mb-3 flex justify-center">
                <div class="relative rounded-3xl bg-gradient-to-br from-rose-100 via-orange-100 to-amber-100 p-2.5 shadow-inner border border-white/70">
                  <img src="/friendship-day/images/friendship_band_hands.png" alt="Tying Friendship Band" class="h-44 w-44 object-cover rounded-2xl drop-shadow-md" />
                  <div class="absolute -right-2 -top-2 rounded-full bg-gradient-to-br from-rose-500 to-orange-400 p-2 text-white shadow-lg animate-heartbeat">
                    <i data-lucide="heart" class="h-5 w-5 fill-current"></i>
                  </div>
                </div>
              </div>

              <!-- Names Tag -->
              <div class="mb-4 text-center">
                <h2 class="font-hand text-3xl font-bold text-rose-600 leading-tight">
                  ${escapeHtml(userName)} & ${escapeHtml(friendName)}
                </h2>
                <div class="mt-0.5 flex items-center justify-center gap-1.5 text-rose-400">
                  <span class="h-px w-6 bg-rose-300"></span>
                  <span class="text-xs font-bold uppercase tracking-wider">Unbreakable Bond</span>
                  <span class="h-px w-6 bg-rose-300"></span>
                </div>
              </div>

              <!-- Personalized Message Parchment Box -->
              <div class="relative rounded-2xl border border-rose-200/80 bg-white/90 p-5 text-left shadow-sm">
                <div class="absolute -top-3 left-4 flex h-7 w-7 items-center justify-center rounded-full bg-rose-500 text-white shadow-md">
                  <i data-lucide="quote" class="h-3.5 w-3.5"></i>
                </div>
                <p class="pt-1 text-left font-hand text-2xl text-gray-800 leading-snug break-words">"${escapeHtml(p.m)}"</p>
                <div class="mt-3 flex items-center justify-end gap-1.5 text-rose-500 whitespace-nowrap">
                  <span class="text-xs font-bold uppercase tracking-wider text-rose-400">With Love,</span>
                  <span class="font-hand text-xl font-bold">${escapeHtml(userName)}</span>
                </div>
              </div>
            </div>

            <!-- Action CTAs -->
            <div class="mt-5 flex flex-col gap-3">
              <button onclick="triggerCelebration()" class="no-select flex w-full items-center justify-center gap-2.5 rounded-2xl bg-gradient-to-r from-rose-500 via-pink-500 to-orange-500 py-4 text-base font-bold text-white shadow-xl shadow-rose-300/60 transition active:scale-[0.97] animate-glow-pulse">
                <i data-lucide="sparkles" class="h-5 w-5"></i> Celebrate with Confetti!
              </button>

              <button onclick="switchView('create')" class="no-select mt-1 flex items-center justify-center gap-2 py-2 text-sm font-semibold text-rose-400 transition hover:text-rose-600">
                <i data-lucide="rotate-ccw" class="h-4 w-4"></i> Create your own wish
              </button>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;

      // Initialize stage-specific logic
      if (state.revealStage === 'collect') {
        initHeartCollectorGame();
      } else if (state.revealStage === 'scratch') {
        setTimeout(() => initScratchCard(() => setRevealStage('meter')), 50);
      }
    }

    function setRevealStage(stage) {
      state.revealStage = stage;
      if (stage === 'collect') {
        state.heartsTapped = 0;
      } else if (stage === 'revealed') {
        triggerCelebration();
      }
      render();
    }

    function switchView(view) {
      state.view = view;
      if (view === 'create') {
        history.pushState(null, '', window.location.pathname);
      }
      render();
    }

    // --- STAGE 1: HEART COLLECTOR GAME ---
    let heartSpawnInterval = null;
    function initHeartCollectorGame() {
      const area = document.getElementById('heart-game-area');
      if (!area) return;

      clearInterval(heartSpawnInterval);

      heartSpawnInterval = setInterval(() => {
        if (state.heartsTapped >= 7) {
          clearInterval(heartSpawnInterval);
          return;
        }
        if (area.childElementCount > 5) return;

        const btn = document.createElement('button');
        btn.setAttribute('type', 'button');
        btn.className = 'no-select absolute -translate-x-1/2 -translate-y-1/2 transition active:scale-90 touch-none';
        btn.style.left = `${10 + Math.random() * 80}%`;
        btn.style.top = `${15 + Math.random() * 70}%`;
        btn.style.animation = 'pop-in 0.3s ease-out both';
        btn.innerHTML = `
          <span class="flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-rose-400 to-pink-400 shadow-lg shadow-rose-300/50 animate-heartbeat">
            <i data-lucide="heart" class="h-7 w-7 text-white fill-current"></i>
          </span>
        `;
        btn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          btn.remove();
          state.heartsTapped += 1;

          const countEl = document.getElementById('collect-count');
          const barEl = document.getElementById('collect-progress-bar');
          const TARGET = 7;
          const p = Math.min(100, (state.heartsTapped / TARGET) * 100);

          if (countEl) countEl.textContent = state.heartsTapped;
          if (barEl) barEl.style.width = `${p}%`;

          createHeartTapBurst(e.clientX || 200, e.clientY || 300);

          if (state.heartsTapped >= 7) {
            clearInterval(heartSpawnInterval);
            setTimeout(() => setRevealStage('scratch'), 450);
          }
        };
        area.appendChild(btn);
        if (window.lucide) lucide.createIcons();

        setTimeout(() => { if (btn.parentNode) btn.remove(); }, 2200);
      }, 650);
    }

    function createHeartTapBurst(x, y) {
      for (let i = 0; i < 6; i++) {
        const particle = document.createElement('div');
        particle.className = 'pointer-events-none fixed z-50 font-bold';
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.textContent = ['💖', '✨', '🌸', '💕'][Math.floor(Math.random() * 4)];
        particle.style.fontSize = `${14 + Math.random() * 10}px`;
        particle.style.transition = 'all 0.5s ease-out';
        document.body.appendChild(particle);

        const dx = (Math.random() - 0.5) * 80;
        const dy = -20 - Math.random() * 60;

        requestAnimationFrame(() => {
          particle.style.transform = `translate(${dx}px, ${dy}px) scale(0.5)`;
          particle.style.opacity = '0';
        });

        setTimeout(() => particle.remove(), 550);
      }
    }

    // --- STAGE 2: SCRATCH CARD ---
    function initScratchCard(onComplete) {
      const canvas = document.getElementById('scratch-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const dpr = window.devicePixelRatio || 1;
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);

      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#fda4af');
      grad.addColorStop(0.5, '#fb7185');
      grad.addColorStop(1, '#fb923c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      for (let i = 0; i < 40; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = Math.random() * 3 + 1;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.font = 'bold 20px Fredoka, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.textAlign = 'center';
      ctx.fillText('Scratch to reveal!', w / 2, h / 2 - 6);
      ctx.font = '14px Fredoka, sans-serif';
      ctx.fillText('Rub your finger across the card', w / 2, h / 2 + 18);

      let isDragging = false;
      let isRevealed = false;
      let scratchMoveCount = 0;

      function scratch(clientX, clientY) {
        if (isRevealed) return;
        scratchMoveCount++;

        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 28, 0, Math.PI * 2);
        ctx.fill();

        if (scratchMoveCount % 6 === 0) {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          let cleared = 0;
          const step = 150;
          for (let i = 3; i < imgData.data.length; i += step * 4) {
            if (imgData.data[i] === 0) cleared++;
          }
          const total = imgData.data.length / (step * 4);
          const pct = (cleared / total) * 100;

          if (pct >= 5 && !isRevealed) {
            isRevealed = true;
            canvas.style.pointerEvents = 'none';
            canvas.style.transition = 'opacity 0.6s ease-out';
            canvas.style.opacity = '0';

            const title = document.getElementById('scratch-title');
            const subtitle = document.getElementById('scratch-subtitle');
            if (title) title.textContent = 'Surprise Revealed! 🎉';
            if (subtitle) subtitle.textContent = 'Here is our special friendship avatar';

            const nextBox = document.getElementById('scratch-next-container');
            if (nextBox) {
              nextBox.classList.remove('hidden');
              if (window.lucide) lucide.createIcons();
            }

            if (confettiInstance) {
              confettiInstance.fire({
                particleCount: 50,
                spread: 75,
                origin: { y: 0.55 },
                colors: ['#fb7185', '#fb923c', '#f43f5e', '#facc15']
              });
            }

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            createHeartTapBurst(centerX, centerY);
          }
        }
      }

      canvas.onpointerdown = (e) => { isDragging = true; scratch(e.clientX, e.clientY); };
      canvas.onpointermove = (e) => { if (isDragging) scratch(e.clientX, e.clientY); };
      canvas.onpointerup = () => (isDragging = false);
      canvas.onpointerleave = () => (isDragging = false);
    }

    // --- STAGE 3: LOVE METER ---
    function pourLove(e) {
      if (state.meterLevel >= 100) return;

      state.meterLevel = Math.min(100, state.meterLevel + 20);
      state.genericWishIndex = (state.genericWishIndex + 1) % GENERIC_WISHES.length;
      const currentWish = GENERIC_WISHES[state.genericWishIndex];

      const liquidGroup = document.getElementById('meter-liquid-group');
      const textEl = document.getElementById('meter-percent-text');
      const wishBox = document.getElementById('meter-wish-box');
      const wishEmoji = document.getElementById('meter-wish-emoji');
      const wishText = document.getElementById('meter-wish-text');
      const btn = document.getElementById('pour-love-btn');

      if (liquidGroup) {
        const translateY = 90 - (state.meterLevel / 100) * 95;
        liquidGroup.style.transform = `translateY(${translateY}px)`;
      }
      if (textEl) {
        textEl.textContent = `${Math.round(state.meterLevel)}%`;
      }

      if (wishBox && wishEmoji && wishText) {
        wishBox.classList.remove('hidden');
        wishBox.classList.remove('animate-pop-in');
        void wishBox.offsetWidth;
        wishBox.classList.add('animate-pop-in');

        wishEmoji.textContent = currentWish.emoji;
        wishText.textContent = currentWish.text;
      }

      if (e) {
        const target = e.currentTarget || e.target;
        const btnRect = target.getBoundingClientRect();
        const startX = btnRect.left + btnRect.width / 2;
        const startY = btnRect.top;

        for (let i = 0; i < 8; i++) {
          setTimeout(() => {
            const p = document.createElement('div');
            p.className = 'pointer-events-none fixed z-50 text-rose-500 font-bold';
            p.style.left = `${startX + (Math.random() - 0.5) * 60}px`;
            p.style.top = `${startY}px`;
            p.textContent = ['💖', '💗', '🥰', '✨', '💕', '🌟'][Math.floor(Math.random() * 6)];
            p.style.fontSize = `${16 + Math.random() * 12}px`;
            p.style.transition = 'all 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
            document.body.appendChild(p);

            requestAnimationFrame(() => {
              p.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -180px) scale(1.3)`;
              p.style.opacity = '0';
            });

            setTimeout(() => p.remove(), 850);
          }, i * 60);
        }
      }

      if (state.meterLevel >= 100) {
        if (btn) {
          btn.disabled = true;
          btn.className = 'no-select flex items-center justify-center gap-2 rounded-2xl py-4 text-base font-semibold text-white shadow-lg bg-green-400 shadow-green-200/50';
          btn.innerHTML = `<i data-lucide="check" class="h-5 w-5"></i> Full!`;
          if (window.lucide) lucide.createIcons();
        }

        setTimeout(() => {
          setRevealStage('revealed');
        }, 1100);
      }
    }

    function getShareableUrl() {
      if (state.token && state.payload) {
        return buildWishesUrl(window.location.origin, state.payload.u, state.payload.f, state.token);
      }
      return window.location.href;
    }

    function shareWish() {
      const url = getShareableUrl();
      const sender = state.payload ? toTitleCase(state.payload.u) : 'Your friend';
      const text = encodeURIComponent(`*Happy Friendship Day!* 💖\n${sender} sent you a magical wish surprise. Open it here:\n${url}`);
      window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    async function copyRevealedUrl() {
      const url = getShareableUrl();
      const btn = document.getElementById('revealed-copy-btn');
      try {
        await navigator.clipboard.writeText(url);
        if (btn) {
          btn.innerHTML = `<i data-lucide="check" class="h-4 w-4 text-green-500"></i> Copied!`;
          if (window.lucide) lucide.createIcons();
          setTimeout(() => {
            btn.innerHTML = `<i data-lucide="copy" class="h-4 w-4"></i> Copy link`;
            if (window.lucide) lucide.createIcons();
          }, 2200);
        }
      } catch (e) {
        alert('Long-press the address bar to copy link.');
      }
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // ═══════════════════════════════════════════════════════════
    // 5. INITIALIZATION
    // ═══════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('confetti-canvas');
      if (canvas) confettiInstance = new ConfettiEngine(canvas);
      initFloatingEmojis();
      parseAppRoute();
      render();

      window.addEventListener('hashchange', () => {
        parseAppRoute();
        render();
      });
      window.addEventListener('popstate', () => {
        parseAppRoute();
        render();
      });
    });
  </script>
