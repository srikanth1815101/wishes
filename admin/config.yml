backend:
  name: git-gateway
  branch: pilot

media_folder: "static/images/wishes"
public_folder: "/images/wishes"

site_url: "https://wishes.csrgo.com"
display_url: "https://wishes.csrgo.com"

collections:
  - name: "wishes"
    label: "Birthday Wish Orders"
    folder: "content/wishes"
    create: true
    slug: "{{slug}}"
    media_folder: "{{media_folder}}/{{slug}}"
    public_folder: "{{public_folder}}/{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor:
      preview: false
    fields:
      - { label: "Paste WhatsApp Message to Auto-Fill Form", name: "whatsapp_order_text", widget: "whatsapp_autofill_box", required: false, hint: "Paste customer WhatsApp order message here to automatically populate name, date, pin, and all balloon messages." }
      - { label: "Customised URL Slug", name: "url", widget: "slug_checker", hint: "URL identifier (e.g. /roja/, /kiran/). Checks availability against content/wishes/ and sets page at wishes.csrgo.com/your-slug/" }
      - { label: "Birthday Person Name", name: "birthday_name", widget: "string" }
      - { label: "Sender Name", name: "sender_name", widget: "string" }
      - { label: "Birth Date", name: "birth_date", widget: "datetime", default: "", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DDT00:00:00", hint: "Select the birth date using the calendar picker" }
      - { label: "7-Digit PIN / Password", name: "pin_code", widget: "pin_hasher", required: false, hint: "Enter a new PIN if you want to change it. Leaves existing pin_hash unchanged if empty." }
      # Photos (6 Direct Image Uploaders)
      - { label: "Photo 1 (Mandatory)", name: "photo_1", widget: "image" }
      - { label: "Photo 2 (Mandatory)", name: "photo_2", widget: "image" }
      - { label: "Photo 3 (Mandatory)", name: "photo_3", widget: "image" }
      - { label: "Photo 4 (Mandatory)", name: "photo_4", widget: "image" }
      - { label: "Photo 5 (Mandatory)", name: "photo_5", widget: "image" }
      - { label: "Photo 6 (Mandatory)", name: "photo_6", widget: "image" }

      # Balloon Messages (6 Direct Input Fields - Auto-fillable & visible immediately)
      - { label: "Balloon Message 1 (Mandatory)", name: "balloon_1", widget: "string" }
      - { label: "Balloon Message 2 (Mandatory)", name: "balloon_2", widget: "string" }
      - { label: "Balloon Message 3 (Mandatory)", name: "balloon_3", widget: "string" }
      - { label: "Balloon Message 4 (Mandatory)", name: "balloon_4", widget: "string" }
      - { label: "Balloon Message 5 (Mandatory)", name: "balloon_5", widget: "string" }
      - { label: "Balloon Message 6 (Mandatory)", name: "balloon_6", widget: "string" }

      - { label: "Birthday Letter", name: "letter", widget: "text" }

  - name: "custom_wishes"
    label: "Custom / Future Orders"
    folder: "content/wishes"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor:
      preview: false
    fields:
      - { label: "Template Type", name: "template_type", widget: "select", options: ["birthday-star", "friendship-day", "anniversary", "custom"], default: "birthday-star" }
      - { label: "Customised URL Slug", name: "url", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Recipient Name", name: "recipient_name", widget: "string", required: false }
      - { label: "Sender Name", name: "sender_name", widget: "string", required: false }
      - { label: "Message / Note", name: "body", widget: "text", required: false }
