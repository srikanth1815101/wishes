backend:
  name: git-gateway
  branch: main

media_folder: "static/images/wishes"
public_folder: "/images/wishes"

site_url: "https://wishes.csrgo.com"
display_url: "https://wishes.csrgo.com"

collections:
  - name: "wishes"
    label: "Birthday Wish Orders"
    folder: "content/wishes"
    create: true
    slug: "{{fields.slug_name}}"
    format: "frontmatter"
    extension: "md"
    editor:
      preview: false
    fields:
      - { label: "Customised URL Slug", name: "slug_name", widget: "slug_checker", hint: "Enter desired slug (e.g., rahul, kiran). Checks availability against wishes folder and automatically saves as url: /your-slug/" }
      - { label: "Birthday Person Name", name: "birthday_name", widget: "string" }
      - { label: "Sender Name", name: "sender_name", widget: "string" }
      - { label: "Birth Date", name: "birth_date", widget: "datetime", default: "", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DDT00:00:00", hint: "Select the birth date using the calendar picker" }
      - { label: "7-Digit PIN / Password", name: "pin_code", widget: "pin_hasher", hint: "Enter the PIN (e.g. 1234567). The encrypted pin_hash is generated and stored in the markdown file automatically on submit." }
      
      # Multi-Photo Uploader (Batch upload up to 6 photos at once with drag/drop reordering)
      - { label: "Photos (Upload 6 Photos at Once with Drag & Reorder)", name: "photos_data", widget: "multi_photo_uploader", hint: "Select all 6 photos together from your computer. Drag or use arrow buttons to reorder them 1 to 6." }

      # 6 Direct Balloon Message Inputs (Always open, auto-fillable with 1 click)
      - { label: "Balloon Message 1 (Mandatory)", name: "balloon_1", widget: "string" }
      - { label: "Balloon Message 2 (Mandatory)", name: "balloon_2", widget: "string" }
      - { label: "Balloon Message 3 (Mandatory)", name: "balloon_3", widget: "string" }
      - { label: "Balloon Message 4 (Mandatory)", name: "balloon_4", widget: "string" }
      - { label: "Balloon Message 5 (Mandatory)", name: "balloon_5", widget: "string" }
      - { label: "Balloon Message 6 (Mandatory)", name: "balloon_6", widget: "string" }

      - { label: "Birthday Letter", name: "letter", widget: "text" }

  - name: "custom_wishes"
    label: "Custom / Future Orders"
    folder: "content/wishes"
    create: true
    slug: "{{fields.slug_name}}"
    format: "frontmatter"
    extension: "md"
    editor:
      preview: false
    fields:
      - { label: "Template Type", name: "template_type", widget: "select", options: ["birthday-star", "friendship-day", "anniversary", "custom"], default: "birthday-star" }
      - { label: "Customised URL Slug", name: "slug_name", widget: "slug_checker" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Recipient Name", name: "recipient_name", widget: "string", required: false }
      - { label: "Sender Name", name: "sender_name", widget: "string", required: false }
      - { label: "Password / PIN", name: "pin_code", widget: "pin_hasher", required: false }
      - { label: "Message / Note", name: "body", widget: "text", required: false }
