backend:
  name: git-gateway
  branch: main

media_folder: "static/images/wishes"
public_folder: "/images/wishes"

site_url: "https://wishes-admin.csrgo.com"
display_url: "https://wishes.csrgo.com"

collections:
  - name: "wishes"
    label: "Birthday Wish Orders"
    folder: "content/wishes"
    create: true
    slug: "{{fields.slug_name}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Customised URL Slug", name: "slug_name", widget: "string", hint: "e.g., rahul, kiran-birthday" }
      - { label: "Full URL Path", name: "url", widget: "string", hint: "/customisedurl/" }
      - { label: "Birthday Person Name", name: "birthday_name", widget: "string" }
      - { label: "Sender Name", name: "sender_name", widget: "string" }
      - { label: "Birth Date", name: "birth_date", widget: "datetime" }
      - { label: "7-Digit PIN Code", name: "pin_code", widget: "string", required: false }
      - { label: "PIN Hash", name: "pin_hash", widget: "string", hint: "Auto-computed hash like h_xdkb3o" }
      - { label: "PIN Hint (Optional)", name: "pin_hint", widget: "string", required: false }
      - label: "Photos (6 items)"
        name: "photos"
        widget: "list"
        min: 6
        max: 6
        field: { label: "Photo", name: "photo", widget: "image" }
      - label: "Balloon Messages (6 items)"
        name: "balloons"
        widget: "list"
        min: 6
        max: 6
        field: { label: "Message", name: "message", widget: "string" }
      - { label: "Birthday Letter", name: "letter", widget: "markdown" }

  - name: "custom_wishes"
    label: "Custom / Other Orders"
    folder: "content/wishes"
    create: true
    slug: "{{fields.slug_name}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Template Type", name: "template_type", widget: "select", options: ["birthday-star", "friendship-day", "anniversary", "custom"], default: "birthday-star" }
      - { label: "Customised URL Slug", name: "slug_name", widget: "string" }
      - { label: "Full URL Path", name: "url", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Recipient Name", name: "recipient_name", widget: "string", required: false }
      - { label: "Sender Name", name: "sender_name", widget: "string", required: false }
      - { label: "Message / Note", name: "body", widget: "markdown", required: false }
      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }
