<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishes Admin | wishes-admin.csrgo.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #fdf4ff 0%, #f3e8ff 50%, #dbeafe 100%);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Helper Bar: ONLY visible once logged in */
      #csrgo-admin-bar {
        display: none;
        background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 8px 18px;
        position: relative;
        z-index: 99999;
      }

      #csrgo-admin-bar.logged-in {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .admin-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
      }

      .admin-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .tool-box {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        padding: 3px 8px;
        gap: 6px;
        font-size: 12px;
      }

      .tool-prefix { color: #9ca3af; font-size: 11px; }
      .tool-input { background: transparent; border: none; outline: none; color: #fff; font-size: 12px; font-weight: 600; width: 130px; font-family: inherit; }
      
      .slug-status { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
      .status-idle { background: #374151; color: #9ca3af; }
      .status-available { background: rgba(16, 185, 129, 0.25); color: #34d399; }
      .status-taken { background: rgba(239, 68, 68, 0.25); color: #f87171; }
      .status-loading { background: rgba(245, 158, 11, 0.25); color: #fbbf24; }

      .pin-hash-badge {
        font-family: monospace;
        font-size: 11px;
        background: rgba(236, 72, 153, 0.25);
        color: #f472b6;
        padding: 2px 6px;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Authenticated Tool Bar (appears ONLY once logged in) -->
    <div id="csrgo-admin-bar">
      <div class="admin-brand">
        ✨ <span>Wishes Admin</span>
      </div>
      <div class="admin-tools">
        <!-- Slug Availability Checker -->
        <div class="tool-box" title="Type a slug to check availability against existing wishes md files">
          <span class="tool-prefix">wishes.csrgo.com/</span>
          <input type="text" id="checkSlugInput" class="tool-input" placeholder="customisedurl" spellcheck="false" autocomplete="off" />
          <span id="slugStatusBadge" class="slug-status status-idle">Check Slug</span>
        </div>

        <!-- 7-Digit PIN Quick Hasher -->
        <div class="tool-box" title="Type 7-digit PIN to get pin_hash">
          <span class="tool-prefix">PIN:</span>
          <input type="text" id="quickPinInput" class="tool-input" placeholder="1234567" maxlength="7" style="width: 60px;" />
          <span id="quickPinHash" class="pin-hash-badge" title="Click to copy hash">h_xdkb3o</span>
        </div>
      </div>
    </div>

    <!-- Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Netlify CMS matching blog version -->
    <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/netlify-cms.js"></script>

    <script>
      // 1. PIN Hasher calculation
      function generatePinHash(pin) {
        if (!pin) return '';
        var hash = 0;
        var str = String(pin).trim();
        for (var i = 0; i < str.length; i++) {
          var char = str.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash;
        }
        return 'h_' + Math.abs(hash).toString(36);
      }

      var pinInput = document.getElementById('quickPinInput');
      var pinHashDisplay = document.getElementById('quickPinHash');
      if (pinInput && pinHashDisplay) {
        pinInput.addEventListener('input', function(e) {
          var val = e.target.value.replace(/\D/g, '');
          e.target.value = val;
          pinHashDisplay.textContent = generatePinHash(val) || 'h_......';
        });
        pinHashDisplay.addEventListener('click', function() {
          if (pinHashDisplay.textContent && pinHashDisplay.textContent !== 'h_......') {
            navigator.clipboard.writeText(pinHashDisplay.textContent);
            var orig = pinHashDisplay.textContent;
            pinHashDisplay.textContent = 'Copied!';
            setTimeout(function() { pinHashDisplay.textContent = orig; }, 1000);
          }
        });
      }

      // 2. Slug availability checker
      var existingSlugs = new Set(["birthday-sample", "kiran"]);
      fetch('/slugs.json')
        .then(function(res) { return res.json(); })
        .then(function(list) {
          if (Array.isArray(list)) list.forEach(function(s) { existingSlugs.add(s.toLowerCase()); });
        })
        .catch(function() {});

      var checkSlugInput = document.getElementById('checkSlugInput');
      var slugStatusBadge = document.getElementById('slugStatusBadge');
      var slugTimer = null;

      if (checkSlugInput && slugStatusBadge) {
        checkSlugInput.addEventListener('input', function() {
          var raw = checkSlugInput.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
          checkSlugInput.value = raw;

          if (!raw) {
            slugStatusBadge.className = 'slug-status status-idle';
            slugStatusBadge.textContent = 'Check Slug';
            return;
          }

          if (existingSlugs.has(raw)) {
            slugStatusBadge.className = 'slug-status status-taken';
            slugStatusBadge.innerHTML = '✕ Taken';
            return;
          }

          slugStatusBadge.className = 'slug-status status-loading';
          slugStatusBadge.innerHTML = 'Checking...';

          clearTimeout(slugTimer);
          slugTimer = setTimeout(function() {
            var url = 'https://api.github.com/repos/srikanth1815101/wishes/contents/content/wishes/' + raw + '.md';
            fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
              .then(function(res) {
                if (res.status === 200) {
                  existingSlugs.add(raw);
                  slugStatusBadge.className = 'slug-status status-taken';
                  slugStatusBadge.innerHTML = '✕ Taken';
                } else {
                  slugStatusBadge.className = 'slug-status status-available';
                  slugStatusBadge.innerHTML = '✓ Available';
                }
              })
              .catch(function() {
                var avail = !existingSlugs.has(raw);
                slugStatusBadge.className = 'slug-status ' + (avail ? 'status-available' : 'status-taken');
                slugStatusBadge.innerHTML = avail ? '✓ Available' : '✕ Taken';
              });
          }, 300);
        });
      }

      // 3. Ensure manual init for Netlify Identity exactly like blog
      window.CMS_MANUAL_INIT = true;

      var adminBar = document.getElementById('csrgo-admin-bar');

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user) {
            if (adminBar) adminBar.classList.remove('logged-in');
            window.netlifyIdentity.on("login", function() {
              document.location.reload();
            });
          } else {
            // User is logged in: show the tools bar
            if (adminBar) adminBar.classList.add('logged-in');
          }
        });
        window.netlifyIdentity.init();
      }

      // 4. Start CMS
      CMS.init();
    </script>
  </body>
</html>
