<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSRGO Wishes | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Clean Full-width CMS form styling */
      div[class*="EditorContainer"] {
        max-width: 920px !important;
        margin: 0 auto !important;
      }

      /* Floating Quick Auto-Fill Banner */
      #order-autofill-banner {
        display: none;
        background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
        border-bottom: 2px solid #ec4899;
        color: #fff;
        padding: 12px 20px;
        position: sticky;
        top: 0;
        z-index: 99999;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      }

      .autofill-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
      }

      .autofill-title {
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #f472b6;
      }

      .autofill-body {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .autofill-textarea {
        width: 100%;
        box-sizing: border-box;
        height: 90px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #fff;
        padding: 10px 14px;
        font-family: monospace;
        font-size: 12px;
        outline: none;
        resize: vertical;
      }

      .autofill-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn-parse-fill {
        background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 18px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: transform 0.1s;
      }

      .btn-parse-fill:hover {
        transform: scale(1.02);
      }

      .parse-status {
        font-size: 12px;
        font-weight: 600;
        color: #34d399;
      }

      /* Custom widget styling */
      .widget-box {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
      }

      .widget-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .widget-input {
        flex: 1;
        padding: 12px 16px;
        font-size: 15px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        outline: none;
        font-family: inherit;
        background: #fff;
        transition: border-color 0.2s;
      }

      .widget-input:focus {
        border-color: #ec4899;
      }

      .badge-indicator {
        font-size: 12px;
        font-weight: 700;
        padding: 8px 14px;
        border-radius: 6px;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }

      .badge-idle { background: #f1f5f9; color: #64748b; }
      .badge-available { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
      .badge-taken { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
      .badge-loading { background: #fef3c7; color: #d97706; }

      .hash-status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #475569;
        background: #fdf2f8;
        border: 1px dashed #f472b6;
        padding: 8px 12px;
        border-radius: 6px;
      }

      .hash-code {
        font-family: monospace;
        font-weight: 700;
        color: #db2777;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- Floating WhatsApp Order Auto-Filler (Visible inside Wish editor) -->
    <div id="order-autofill-banner">
      <div class="autofill-header" id="toggleAutofill">
        <div class="autofill-title">
          <span>⚡ Paste WhatsApp Order to Auto-Fill</span>
          <span style="font-size: 11px; font-weight: normal; color: #cbd5e1;">(Click to paste order text from WhatsApp)</span>
        </div>
      </div>
      <div class="autofill-body" id="autofillContent">
        <textarea id="whatsappOrderInput" class="autofill-textarea" placeholder="Paste WhatsApp message here (e.g. *Birthday Person:* Roja, *Date of Birth:* 2026-09-18, *Secret PIN:* 1234567, 6 Balloon messages, Main wish message)..."></textarea>
        <div class="autofill-actions">
          <button type="button" class="btn-parse-fill" id="btnAutoFill">✨ Auto-Fill Form Fields</button>
          <span id="parseStatus" class="parse-status"></span>
        </div>
      </div>
    </div>

    <!-- Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Netlify CMS (Matching Blog Engine) -->
    <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/netlify-cms.js"></script>

    <script>
      // 1. PIN Hashing algorithm matching birthday-star
      function generatePinHash(val) {
        if (!val) return '';
        var hash = 0;
        var str = String(val).trim();
        for (var i = 0; i < str.length; i++) {
          var char = str.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash;
        }
        return 'h_' + Math.abs(hash).toString(36);
      }

      // 2. Slug availability verification cache
      var existingSlugs = new Set(["birthday-sample", "kiran"]);
      fetch('/slugs.json')
        .then(function(r) { return r.json(); })
        .then(function(list) {
          if (Array.isArray(list)) list.forEach(function(s) { existingSlugs.add(s.toLowerCase()); });
        })
        .catch(function() {});

      // 3. Custom In-Form "slug_checker" Widget
      var SlugCheckerControl = createClass({
        getInitialState: function() {
          return {
            status: 'idle',
            message: 'Check Availability'
          };
        },
        handleChange: function(e) {
          var self = this;
          var val = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
          this.props.onChange(val);

          if (!val) {
            this.setState({ status: 'idle', message: 'Enter slug' });
            return;
          }

          if (existingSlugs.has(val)) {
            this.setState({ status: 'taken', message: '✕ Taken (file exists)' });
            return;
          }

          this.setState({ status: 'loading', message: 'Checking...' });

          clearTimeout(this._timer);
          this._timer = setTimeout(function() {
            var url = 'https://api.github.com/repos/srikanth1815101/wishes/contents/content/wishes/' + val + '.md';
            fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
              .then(function(res) {
                if (res.status === 200) {
                  existingSlugs.add(val);
                  self.setState({ status: 'taken', message: '✕ URL Taken (in wishes folder)' });
                } else {
                  self.setState({ status: 'available', message: '✓ URL Available!' });
                }
              })
              .catch(function() {
                var isAvail = !existingSlugs.has(val);
                self.setState({
                  status: isAvail ? 'available' : 'taken',
                  message: isAvail ? '✓ Available' : '✕ Taken'
                });
              });
          }, 350);
        },
        render: function() {
          var val = this.props.value || '';
          var statusClass = 'badge-idle';
          if (this.state.status === 'available') statusClass = 'badge-available';
          if (this.state.status === 'taken') statusClass = 'badge-taken';
          if (this.state.status === 'loading') statusClass = 'badge-loading';

          return h('div', { className: 'widget-box' },
            h('div', { className: 'widget-row' },
              h('input', {
                type: 'text',
                id: this.props.forID,
                className: 'widget-input',
                value: val,
                placeholder: 'e.g. rahul, kiran',
                onChange: this.handleChange
              }),
              h('span', { className: 'badge-indicator ' + statusClass }, this.state.message)
            ),
            val ? h('div', { style: { fontSize: '13px', color: '#64748b' } },
              'Page will publish at: ',
              h('strong', { style: { color: '#0f172a' } }, 'https://wishes.csrgo.com/' + val + '/')
            ) : null
          );
        }
      });

      CMS.registerWidget('slug_checker', SlugCheckerControl);

      // 4. Custom Single "pin_hasher" Widget:
      // Admin only enters PIN (e.g. 1234567); displays hash confirmation; writes encrypted pin_hash to MD file!
      var PinHasherControl = createClass({
        handleChange: function(e) {
          var val = e.target.value.trim();
          this.props.onChange(val);
        },
        render: function() {
          var val = this.props.value || '';
          var computedHash = generatePinHash(val);

          return h('div', { className: 'widget-box' },
            h('div', { className: 'widget-row' },
              h('input', {
                type: 'text',
                id: this.props.forID,
                className: 'widget-input',
                value: val,
                placeholder: 'e.g. 1234567',
                onChange: this.handleChange
              })
            ),
            computedHash ? h('div', { className: 'hash-status-row' },
              '🔒 Encrypted PIN Hash to be saved in MD: ',
              h('span', { className: 'hash-code' }, computedHash)
            ) : null
          );
        }
      });

      CMS.registerWidget('pin_hasher', PinHasherControl);

      // 5. PreSave Hook: Automatically inject computed `url`, `pin_hash`, `photos` array, and `balloons` array into frontmatter!
      CMS.registerEventListener({
        name: 'preSave',
        handler: function(data) {
          var entry = data.entry;
          var slug = entry.getIn(['data', 'slug_name']);
          var pinCode = entry.getIn(['data', 'pin_code']);
          var updates = {};

          if (slug) {
            var cleanSlug = String(slug).toLowerCase().trim().replace(/^\/+|\/+$/g, '');
            updates.url = '/' + cleanSlug + '/';
          }

          if (pinCode) {
            updates.pin_hash = generatePinHash(pinCode);
          }

          // Convert individual photo_1...photo_6 inputs into standard photos array
          var photoList = [];
          for (var p = 1; p <= 6; p++) {
            var photoVal = entry.getIn(['data', 'photo_' + p]);
            if (photoVal) {
              photoList.push(photoVal);
            }
          }
          if (photoList.length > 0) {
            updates.photos = photoList;
          }

          // Convert individual balloon_1...balloon_6 inputs into standard balloons array
          var balloonList = [];
          for (var b = 1; b <= 6; b++) {
            var balloonVal = entry.getIn(['data', 'balloon_' + b]);
            if (balloonVal) {
              balloonList.push(balloonVal);
            }
          }
          if (balloonList.length > 0) {
            updates.balloons = balloonList;
          }

          if (Object.keys(updates).length > 0) {
            return entry.get('data').merge(updates);
          }
          return entry.get('data');
        }
      });

      // 6. WhatsApp Order Auto-Fill Parser
      function parseWhatsAppOrder(text) {
        var result = {};
        if (!text) return result;

        // Extract Birthday Person Name
        var nameMatch = text.match(/\*?Birthday Person:?\*?\s*([^\n\r]+)/i);
        if (nameMatch) {
          result.birthday_name = nameMatch[1].trim();
          result.slug_name = result.birthday_name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
        }

        // Extract Date of Birth
        var dobMatch = text.match(/\*?Date of Birth:?\*?\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/i);
        if (dobMatch) {
          result.birth_date = dobMatch[1].trim();
        }

        // Extract Ordered By
        var senderMatch = text.match(/\*?Ordered By:?\*?\s*([^\n\r]+)/i);
        if (senderMatch) {
          result.sender_name = senderMatch[1].trim();
        }

        // Extract Secret PIN
        var pinMatch = text.match(/\*?Secret PIN:?\*?\s*([0-9a-zA-Z]+)/i);
        if (pinMatch) {
          result.pin_code = pinMatch[1].trim();
        }

        // Extract Balloon Messages (1 to 6)
        result.balloons = [];
        for (var i = 1; i <= 6; i++) {
          var balloonRegex = new RegExp('(?:^|\\n)\\s*' + i + '\\.\\s*([^\\n\\r]+)', 'i');
          var bMatch = text.match(balloonRegex);
          if (bMatch) {
            result.balloons.push(bMatch[1].trim());
          }
        }

        // Extract Main Wish Message
        var wishMatch = text.match(/\*?Main Wish Message:?\*?\s*([\s\S]*?)(?:-{3,}|\*Amount|$)/i);
        if (wishMatch) {
          result.letter = wishMatch[1].trim();
        }

        return result;
      }

      // Helper to simulate native input event so React/Decap CMS updates state
      function setNativeInputValue(el, value) {
        if (!el) return;
        var prototype = Object.getPrototypeOf(el);
        var descriptor = Object.getOwnPropertyDescriptor(prototype, 'value');
        if (descriptor && descriptor.set) {
          descriptor.set.call(el, value);
        } else {
          el.value = value;
        }
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }

      // Setup Auto-Fill Banner logic
      var autofillBanner = document.getElementById('order-autofill-banner');
      var autofillBtn = document.getElementById('btnAutoFill');
      var parseStatus = document.getElementById('parseStatus');
      var orderInput = document.getElementById('whatsappOrderInput');

      if (autofillBtn) {
        autofillBtn.addEventListener('click', function() {
          var raw = orderInput.value;
          var parsed = parseWhatsAppOrder(raw);
          var filledCount = 0;

          // 1. Fill Slug
          if (parsed.slug_name) {
            var slugEl = document.querySelector('input[id*="slug_name"]');
            if (slugEl) { setNativeInputValue(slugEl, parsed.slug_name); filledCount++; }
          }

          // 2. Fill Birthday Person
          if (parsed.birthday_name) {
            var bNameEl = document.querySelector('input[id*="birthday_name"]');
            if (bNameEl) { setNativeInputValue(bNameEl, parsed.birthday_name); filledCount++; }
          }

          // 3. Fill Sender Name
          if (parsed.sender_name) {
            var senderEl = document.querySelector('input[id*="sender_name"]');
            if (senderEl) { setNativeInputValue(senderEl, parsed.sender_name); filledCount++; }
          }

          // 4. Fill Date of Birth
          if (parsed.birth_date) {
            var dateEl = document.querySelector('input[id*="birth_date"]');
            if (dateEl) { setNativeInputValue(dateEl, parsed.birth_date); filledCount++; }
          }

          // 5. Fill PIN
          if (parsed.pin_code) {
            var pinEl = document.querySelector('input[id*="pin_code"]');
            if (pinEl) { setNativeInputValue(pinEl, parsed.pin_code); filledCount++; }
          }

          // 6. Fill Balloon Messages 1 to 6 directly into their own dedicated inputs!
          if (parsed.balloons && parsed.balloons.length > 0) {
            for (var bi = 0; bi < parsed.balloons.length; bi++) {
              var idx = bi + 1;
              var bEl = document.querySelector('input[id*="balloon_' + idx + '"]');
              if (bEl) {
                setNativeInputValue(bEl, parsed.balloons[bi]);
                filledCount++;
              }
            }
          }

          // 7. Fill Main Letter
          if (parsed.letter) {
            var letterEl = document.querySelector('textarea[id*="letter"]');
            if (letterEl) { setNativeInputValue(letterEl, parsed.letter); filledCount++; }
          }

          if (filledCount > 0) {
            parseStatus.style.color = '#34d399';
            parseStatus.textContent = '✓ Auto-filled ' + filledCount + ' fields! Review and adjust if needed.';
          } else {
            parseStatus.style.color = '#fbbf24';
            parseStatus.textContent = 'Please make sure you are on the New Entry page before clicking Auto-Fill.';
          }
        });
      }

      // Check current URL hash to display autofill banner only when editing/creating
      function checkRouteForBanner() {
        if (window.location.hash.indexOf('/collections/wishes/new') !== -1 ||
            window.location.hash.indexOf('/collections/wishes/entries/') !== -1) {
          if (autofillBanner) autofillBanner.style.display = 'block';
        } else {
          if (autofillBanner) autofillBanner.style.display = 'none';
        }
      }
      window.addEventListener('hashchange', checkRouteForBanner);
      setInterval(checkRouteForBanner, 1000);

      // 7. Netlify Identity handling (identical to blog pattern)
      window.CMS_MANUAL_INIT = true;

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user) {
            window.netlifyIdentity.on("login", function() {
              document.location.reload();
            });
          }
        });
        window.netlifyIdentity.init();
      }

      // Start CMS safely
      CMS.init();
    </script>
  </body>
</html>
