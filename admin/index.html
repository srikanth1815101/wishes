  <body>
    <script>
      try {
        localStorage.setItem('cms.preview-visible', 'false');
      } catch (e) {}
    </script>
    <!-- Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Immutable.js for clean OrderedMap frontmatter serialization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/immutable/3.8.2/immutable.min.js"></script>

    <!-- Network Interceptor: Automatically populate photo_1..6 and balloon_1..6 for existing wish records -->
    <script>
      (function() {
        function decodeUtf8Base64(b64) {
          try {
            var clean = b64.replace(/\s+/g, '');
            var binary = atob(clean);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) {
              bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
          } catch (e) {
            return atob(b64);
          }
        }

        function encodeUtf8Base64(str) {
          try {
            var bytes = new TextEncoder().encode(str);
            var binary = '';
            for (var i = 0; i < bytes.length; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
          } catch (e) {
            return btoa(str);
          }
        }

        function transformMarkdown(text) {
          if (!text || typeof text !== 'string') return text;
          var parts = text.split(/^---\s*$/m);
          if (parts.length < 3) return text;

          var frontmatter = parts[1];
          var body = parts.slice(2).join('---');

          // Extract photos list
          var photos = [];
          var photosMatch = frontmatter.match(/photos:\s*\n((?:\s*-\s*[^\n]+\n?)+)/);
          if (photosMatch) {
            var pLines = photosMatch[1].split('\n');
            for (var i = 0; i < pLines.length; i++) {
              var pLine = pLines[i].trim();
              if (pLine.startsWith('-')) {
                var cleanP = pLine.substring(1).trim().replace(/^["']|["']$/g, '');
                if (cleanP) photos.push(cleanP);
              }
            }
          }

          // Extract balloons list
          var balloons = [];
          var balloonsMatch = frontmatter.match(/balloons:\s*\n((?:\s*-\s*[^\n]+\n?)+)/);
          if (balloonsMatch) {
            var bLines = balloonsMatch[1].split('\n');
            for (var j = 0; j < bLines.length; j++) {
              var bLine = bLines[j].trim();
              if (bLine.startsWith('-')) {
                var cleanB = bLine.substring(1).trim().replace(/^["']|["']$/g, '');
                if (cleanB) balloons.push(cleanB);
              }
            }
          }

          var additions = [];
          for (var p = 0; p < photos.length && p < 6; p++) {
            var pKey = 'photo_' + (p + 1);
            var pRegex = new RegExp('^\\s*' + pKey + ':', 'm');
            if (!pRegex.test(frontmatter)) {
              additions.push(pKey + ': ' + JSON.stringify(photos[p]));
            }
          }

          for (var b = 0; b < balloons.length && b < 6; b++) {
            var bKey = 'balloon_' + (b + 1);
            var bRegex = new RegExp('^\\s*' + bKey + ':', 'm');
            if (!bRegex.test(frontmatter)) {
              additions.push(bKey + ': ' + JSON.stringify(balloons[b]));
            }
          }

          if (additions.length === 0) return text;

          var newFm = frontmatter.trimEnd() + '\n' + additions.join('\n') + '\n';
          return '---\n' + newFm.replace(/^\n+/, '') + '---' + body;
        }

        var origFetch = window.fetch;
        if (origFetch) {
          window.fetch = function(input, init) {
            var url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
            return origFetch.apply(this, arguments).then(function(res) {
              try {
                if (!res || !res.ok) return res;
                var contentType = res.headers ? (res.headers.get('content-type') || '') : '';
                var isJson = contentType.indexOf('json') !== -1;
                var isMarkdownPath = (url && (url.indexOf('content/wishes') !== -1 || url.indexOf('.md') !== -1));

                if (isJson || isMarkdownPath) {
                  return res.clone().text().then(function(text) {
                    try {
                      if (isJson) {
                        var data = JSON.parse(text);
                        if (data && data.content && data.encoding === 'base64') {
                          var decoded = decodeUtf8Base64(data.content);
                          if (decoded && decoded.trimStart().startsWith('---')) {
                            var transformed = transformMarkdown(decoded);
                            if (transformed !== decoded) {
                              data.content = encodeUtf8Base64(transformed);
                              return new Response(JSON.stringify(data), {
                                status: res.status,
                                statusText: res.statusText,
                                headers: res.headers
                              });
                            }
                          }
                        }
                      } else {
                        if (text && text.trimStart().startsWith('---')) {
                          var transformedText = transformMarkdown(text);
                          if (transformedText !== text) {
                            return new Response(transformedText, {
                              status: res.status,
                              statusText: res.statusText,
                              headers: res.headers
                            });
                          }
                        }
                      }
                    } catch(e) {
                      console.warn('[CMS Interceptor] error:', e);
                    }
                    return res;
                  }).catch(function() {
                    return res;
                  });
                }
              } catch(e) {}
              return res;
            });
          };
        }

        // Global Image Fallback Handler for Admin Section
        window.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'IMG') {
            var src = e.target.getAttribute('src') || e.target.src || '';
            if (src.indexOf('/images/') !== -1) {
              var clean = src.substring(src.indexOf('/images/'));
              if (!e.target._retriedRaw) {
                e.target._retriedRaw = true;
                e.target.src = 'https://raw.githubusercontent.com/srikanth1815101/wishes/main/static' + clean;
                return;
              }
              if (!e.target._retriedProd) {
                e.target._retriedProd = true;
                e.target.src = 'https://wishes.csrgo.com' + clean;
                return;
              }
            }
          }
        }, true);
      })();
    </script>

    <!-- Netlify CMS (Matching Blog Engine) -->
    <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/netlify-cms.js"></script>

    <script>
      // 1. PIN Hashing algorithm matching birthday-star
      function generatePinHash(val) {
        if (!val) return '';
        var hash = 0;
        var str = String(val).trim();
        for (var i = 0; i < str.length; i++) {
          var char = str.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash;
        }
        return 'h_' + Math.abs(hash).toString(36);
      }

      // 2. Slug availability verification cache
      var existingSlugs = new Set(["birthday-sample", "kiran"]);
      fetch('/slugs.json')
        .then(function(r) { return r.json(); })
        .then(function(list) {
          if (Array.isArray(list)) list.forEach(function(s) { existingSlugs.add(s.toLowerCase()); });
        })
        .catch(function() {});

      // 3. Custom In-Form "whatsapp_autofill_box" Widget (Embedded right in the form!)
      // 3. Custom In-Form "whatsapp_autofill_box" Widget
      var WhatsAppAutoFillControl = createClass({
        getInitialState: function() {
          return { status: '', text: this.props.value || '' };
        },
        handleTextChange: function(e) {
          this.setState({ text: e.target.value });
          this.props.onChange(e.target.value);
        },
        handleAutoFill: function() {
          var parsed = parseWhatsAppOrder(this.state.text);
          var filledCount = 0;

          // 1. Fill Slug
          if (parsed.slug) {
            var slugEl = document.querySelector('input[id*="slug"]');
            if (slugEl) { setNativeInputValue(slugEl, parsed.slug); filledCount++; }
          }

          // 2. Fill Birthday Person
          if (parsed.birthday_name) {
            var bNameEl = document.querySelector('input[id*="birthday_name"]');
            if (bNameEl) { setNativeInputValue(bNameEl, parsed.birthday_name); filledCount++; }
          }

          // 3. Fill Sender Name
          if (parsed.sender_name) {
            var senderEl = document.querySelector('input[id*="sender_name"]');
            if (senderEl) { setNativeInputValue(senderEl, parsed.sender_name); filledCount++; }
          }

          // 4. Fill Date of Birth
          if (parsed.birth_date) {
            var dateEl = document.querySelector('input[id*="birth_date"]');
            if (dateEl) { setNativeInputValue(dateEl, parsed.birth_date); filledCount++; }
          }

          // 5. Fill PIN
          if (parsed.pin_code) {
            var pinEl = document.querySelector('input[id*="pin_code"]');
            if (pinEl) { setNativeInputValue(pinEl, parsed.pin_code); filledCount++; }
          }

          // 6. Fill Balloon Messages (Direct individual fields balloon_1 through balloon_6)
          if (parsed.balloons && parsed.balloons.length > 0) {
            for (var bi = 0; bi < parsed.balloons.length && bi < 6; bi++) {
              var bNum = bi + 1;
              var bEl = document.querySelector('input[id*="balloon_' + bNum + '"]') ||
                        document.querySelector('input[name="balloon_' + bNum + '"]');
              if (bEl) {
                setNativeInputValue(bEl, parsed.balloons[bi]);
                filledCount++;
              }
            }
          }

          // 7. Fill Main Letter
          if (parsed.letter) {
            var letterEl = document.querySelector('textarea[id*="letter"]') ||
                           document.querySelector('input[id*="letter"]');
            if (letterEl) { setNativeInputValue(letterEl, parsed.letter); filledCount++; }
          }

          if (filledCount > 0) {
            this.setState({ status: '✓ Successfully auto-filled ' + filledCount + ' fields below!' });
          } else {
            this.setState({ status: 'Could not find fields to parse. Please check WhatsApp message format.' });
          }
        },
        render: function() {
          var self = this;
          return h('div', { className: 'autofill-card' },
            h('div', { className: 'autofill-header' },
              h('div', { className: 'autofill-title' }, '⚡ 1-Click WhatsApp Order Auto-Fill')
            ),
            h('textarea', {
              className: 'autofill-textarea',
              value: this.state.text,
              placeholder: 'Paste the WhatsApp order message here (e.g. *Birthday Person:* Roja, *Date of Birth:* 2026-09-18, *Secret PIN:* 1234567, 6 Balloon messages, Main wish message)...',
              onChange: this.handleTextChange
            }),
            h('div', { className: 'autofill-actions' },
              h('button', {
                type: 'button',
                className: 'btn-parse-fill',
                onClick: this.handleAutoFill
              }, '✨ Auto-Fill Form Fields Below'),
              self.state.status ? h('span', { className: 'parse-status' }, self.state.status) : null
            )
          );
        }
      });

      CMS.registerWidget('whatsapp_autofill_box', WhatsAppAutoFillControl);

      // 4. Custom In-Form "slug_checker" Widget
      var SlugCheckerControl = createClass({
        getInitialState: function() {
          return {
            status: 'idle',
            message: 'Check Availability'
          };
        },
        componentDidMount: function() {
          if (!this.props.value && this.props.entry) {
            var existingSlug = this.props.entry.getIn(['data', 'slug']) || this.props.entry.get('slug');
            if (!existingSlug) {
              var existingUrl = this.props.entry.getIn(['data', 'url']);
              if (existingUrl) {
                existingSlug = String(existingUrl).replace(/^\/+|\/+$/g, '');
              }
            }
            if (existingSlug) {
              this.props.onChange(existingSlug);
            }
          }

          // Fallback auto-populator for balloon inputs if they are empty
          if (this.props.entry) {
            try {
              var entryData = this.props.entry.get('data');
              if (entryData) {
                var balloons = entryData.get('balloons');
                if (balloons) {
                  var bArr = balloons.toJS ? balloons.toJS() : (Array.isArray(balloons) ? balloons : []);
                  var fillBalloons = function() {
                    for (var bi = 0; bi < bArr.length && bi < 6; bi++) {
                      var bNum = bi + 1;
                      var bEl = document.querySelector('input[id*="balloon_' + bNum + '"]') ||
                                document.querySelector('input[name*="balloon_' + bNum + '"]');
                      if (bEl && !bEl.value && bArr[bi]) {
                        setNativeInputValue(bEl, bArr[bi]);
                      }
                    }
                  };
                  setTimeout(fillBalloons, 150);
                  setTimeout(fillBalloons, 600);
                  setTimeout(fillBalloons, 1500);
                }
              }
            } catch(e) {}
          }
        },
        handleChange: function(e) {
          var self = this;
          var val = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
          this.props.onChange(val);

          if (!val) {
            this.setState({ status: 'idle', message: 'Enter slug' });
            return;
          }

          if (existingSlugs.has(val)) {
            this.setState({ status: 'taken', message: '✕ Taken (file exists)' });
            return;
          }

          this.setState({ status: 'loading', message: 'Checking...' });

          clearTimeout(this._timer);
          this._timer = setTimeout(function() {
            var url = 'https://api.github.com/repos/srikanth1815101/wishes/contents/content/wishes/' + val + '.md';
            fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
              .then(function(res) {
                if (res.status === 200) {
                  existingSlugs.add(val);
                  self.setState({ status: 'taken', message: '✕ URL Taken (in wishes folder)' });
                } else {
                  self.setState({ status: 'available', message: '✓ URL Available!' });
                }
              })
              .catch(function() {
                var isAvail = !existingSlugs.has(val);
                self.setState({
                  status: isAvail ? 'available' : 'taken',
                  message: isAvail ? '✓ Available' : '✕ Taken'
                });
              });
          }, 350);
        },
        render: function() {
          var val = this.props.value || '';
          var statusClass = 'badge-idle';
          if (this.state.status === 'available') statusClass = 'badge-available';
          if (this.state.status === 'taken') statusClass = 'badge-taken';
          if (this.state.status === 'loading') statusClass = 'badge-loading';

          return h('div', { className: 'widget-box' },
            h('div', { className: 'widget-row' },
              h('input', {
                type: 'text',
                id: this.props.forID,
                className: 'widget-input',
                value: val,
                placeholder: 'e.g. rahul, kiran',
                onChange: this.handleChange
              }),
              h('span', { className: 'badge-indicator ' + statusClass }, this.state.message)
            ),
            val ? h('div', { style: { fontSize: '13px', color: '#64748b' } },
              'Page will publish at: ',
              h('strong', { style: { color: '#0f172a' } }, 'https://wishes.csrgo.com/' + val + '/')
            ) : null
          );
        }
      });

      CMS.registerWidget('slug_checker', SlugCheckerControl);

      // 5. Custom Single "pin_hasher" Widget
      var PinHasherControl = createClass({
        handleChange: function(e) {
          var val = e.target.value.trim();
          this.props.onChange(val);
        },
        render: function() {
          var val = this.props.value || '';
          var computedHash = generatePinHash(val);
          var existingHash = (!computedHash && this.props.entry) ? this.props.entry.getIn(['data', 'pin_hash']) : '';

          return h('div', { className: 'widget-box' },
            h('div', { className: 'widget-row' },
              h('input', {
                type: 'text',
                id: this.props.forID,
                className: 'widget-input',
                value: val,
                placeholder: 'e.g. 1234567 (leave blank to keep existing PIN)',
                onChange: this.handleChange
              })
            ),
            computedHash ? h('div', { className: 'hash-status-row' },
              '🔒 New Encrypted PIN Hash to be saved: ',
              h('span', { className: 'hash-code' }, computedHash)
            ) : (existingHash ? h('div', { className: 'hash-status-row', style: { background: '#f0fdf4', borderColor: '#86efac', color: '#166534' } },
              '🔒 Active PIN Hash in record: ',
              h('span', { className: 'hash-code', style: { color: '#16a34a' } }, existingHash),
              h('span', { style: { fontSize: '12px', marginLeft: '6px', color: '#15803d' } }, '(Kept unchanged unless you enter a new 7-digit PIN)')
            ) : null)
          );
        }
      });

      CMS.registerWidget('pin_hasher', PinHasherControl);

      // 8. PreSave Hook: Cleanly assemble frontmatter & strip unwanted fields
      CMS.registerEventListener({
        name: 'preSave',
        handler: function(data) {
          var entry = data.entry;
          var slugVal = entry.getIn(['data', 'slug']);
          var pinCode = entry.getIn(['data', 'pin_code']);
          var existingPinHash = entry.getIn(['data', 'pin_hash']);
          var birthdayName = entry.getIn(['data', 'birthday_name']) || '';
          var senderName = entry.getIn(['data', 'sender_name']) || '';
          var birthDate = entry.getIn(['data', 'birth_date']) || '';
          var letter = entry.getIn(['data', 'letter']) || '';

          // 1. Slug & URL
          var cleanSlug = '';
          if (slugVal) {
            cleanSlug = String(slugVal).toLowerCase().trim().replace(/[^a-z0-9-]/g, '').replace(/^-+|-+$/g, '');
          }

          // 2. PIN Hash
          var finalPinHash = existingPinHash || '';
          if (pinCode && String(pinCode).trim().length > 0) {
            finalPinHash = generatePinHash(pinCode);
          }

          // 3. Assemble Photos Array (preserve actual uploaded paths)
          var photos = [];
          for (var p = 1; p <= 6; p++) {
            var pVal = entry.getIn(['data', 'photo_' + p]);
            if (pVal && String(pVal).trim()) {
              photos.push(String(pVal).trim());
            }
          }
          if (photos.length === 0) {
            var existP = entry.getIn(['data', 'photos']);
            if (existP) {
              photos = existP.toJS ? existP.toJS() : (Array.isArray(existP) ? existP : []);
            }
          }

          // 4. Assemble Balloons Array
          var balloons = [];
          for (var b = 1; b <= 6; b++) {
            var bVal = entry.getIn(['data', 'balloon_' + b]);
            if (bVal && String(bVal).trim()) {
              balloons.push(String(bVal).trim());
            }
          }
          if (balloons.length === 0) {
            var existB = entry.getIn(['data', 'balloons']);
            if (existB) {
              balloons = existB.toJS ? existB.toJS() : (Array.isArray(existB) ? existB : []);
            }
          }

          // 5. Build clean frontmatter with ONLY single arrays for photos and balloons (NO duplicate photo_1..6 or balloon_1..6)
          var cleanData;
          if (window.Immutable && window.Immutable.OrderedMap) {
            cleanData = window.Immutable.OrderedMap();
            if (cleanSlug) {
              cleanData = cleanData.set('slug', cleanSlug);
              cleanData = cleanData.set('url', '/' + cleanSlug + '/');
            }
            if (birthdayName) cleanData = cleanData.set('birthday_name', birthdayName);
            if (senderName) cleanData = cleanData.set('sender_name', senderName);
            if (birthDate) cleanData = cleanData.set('birth_date', birthDate);
            if (finalPinHash) cleanData = cleanData.set('pin_hash', finalPinHash);
            var pinHint = entry.getIn(['data', 'pin_hint']);
            if (pinHint) cleanData = cleanData.set('pin_hint', pinHint);

            // Save ONLY the arrays (single entry, no duplicate photo_1..6 or balloon_1..6 fields)
            cleanData = cleanData.set('photos', window.Immutable.fromJS(photos));
            cleanData = cleanData.set('balloons', window.Immutable.fromJS(balloons));
            if (letter) cleanData = cleanData.set('letter', letter);
          } else {
            cleanData = entry.get('data');
            for (var p = 1; p <= 6; p++) {
              cleanData = cleanData.delete('photo_' + p);
            }
            for (var b = 1; b <= 6; b++) {
              cleanData = cleanData.delete('balloon_' + b);
            }
            cleanData = cleanData.delete('pin_code');
            cleanData = cleanData.delete('whatsapp_order_text');
            cleanData = cleanData.delete('slug_name');

            cleanData = cleanData.set('photos', photos);
            cleanData = cleanData.set('balloons', balloons);
            if (cleanSlug) {
              cleanData = cleanData.set('slug', cleanSlug);
              cleanData = cleanData.set('url', '/' + cleanSlug + '/');
            }
            if (finalPinHash) cleanData = cleanData.set('pin_hash', finalPinHash);
          }

          return cleanData;
        }
      });

      // 9. WhatsApp Order Parsing function
      function parseWhatsAppOrder(text) {
        var result = {};
        if (!text) return result;

        var nameMatch = text.match(/(?:\*?Birthday Person:?\*?|birthday_name:?)\s*([^\n\r]+)/i);
        if (nameMatch) {
          result.birthday_name = nameMatch[1].trim();
          var slugClean = result.birthday_name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-+|-+$/g, '');
          result.slug = slugClean;
          result.url = '/' + slugClean + '/';
        }

        var slugMatch = text.match(/(?:slug_name|slug):?\s*([a-z0-9-]+)/i);
        if (slugMatch) {
          result.slug = slugMatch[1].trim().toLowerCase();
          result.url = '/' + result.slug + '/';
        }

        var dobMatch = text.match(/(?:\*?Date of Birth:?\*?|birth_date:?)\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/i);
        if (dobMatch) {
          result.birth_date = dobMatch[1].trim() + 'T00:00:00';
        }

        var senderMatch = text.match(/(?:\*?Ordered By:?\*?|sender_name:?)\s*([^\n\r]+)/i);
        if (senderMatch) {
          result.sender_name = senderMatch[1].trim();
        }

        var pinMatch = text.match(/(?:\*?Secret PIN:?\*?|pin_code:?)\s*["']?([0-9a-zA-Z]+)["']?/i);
        if (pinMatch) {
          result.pin_code = pinMatch[1].trim();
        }

        result.balloons = [];
        // First try numbered format: 1. message
        for (var i = 1; i <= 6; i++) {
          var balloonRegex = new RegExp('(?:^|\\n)\\s*' + i + '[\\.\\)]\\s*([^\\n\\r]+)', 'i');
          var bMatch = text.match(balloonRegex);
          if (bMatch) {
            result.balloons.push(bMatch[1].trim());
          }
        }

        // If not found by numbers, try finding "balloons:" list with "- message"
        if (result.balloons.length === 0) {
          var balloonSectionMatch = text.match(/balloons:?\s*([\s\S]*?)(?:[a-z_]+:|$)/i);
          if (balloonSectionMatch) {
            var bLines = balloonSectionMatch[1].split('\n');
            for (var bi = 0; bi < bLines.length && result.balloons.length < 6; bi++) {
              var bLine = bLines[bi].trim();
              if (bLine.startsWith('-')) {
                var cleanBLine = bLine.substring(1).trim().replace(/^["']|["']$/g, '');
                if (cleanBLine) result.balloons.push(cleanBLine);
              }
            }
          }
        }

        var wishMatch = text.match(/(?:\*?Main Wish Message:?\*?|letter:?)\s*([\s\S]*?)(?:-{3,}|\*Amount|$)/i);
        if (wishMatch) {
          result.letter = wishMatch[1].trim();
        }

        return result;
      }

      function setNativeInputValue(el, value) {
        if (!el) return;
        var prototype = Object.getPrototypeOf(el);
        var descriptor = Object.getOwnPropertyDescriptor(prototype, 'value');
        if (descriptor && descriptor.set) {
          descriptor.set.call(el, value);
        } else {
          el.value = value;
        }
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }

      // 10. Netlify Identity handling
      window.CMS_MANUAL_INIT = true;

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user) {
            window.netlifyIdentity.on("login", function() {
              document.location.reload();
            });
          }
        });
        window.netlifyIdentity.init();
      }

      // Start CMS
      CMS.init();
    </script>
  </body>
