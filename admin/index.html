<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSRGO Wishes | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Clean Full-width CMS form styling */
      div[class*="EditorContainer"] {
        max-width: 960px !important;
        margin: 0 auto !important;
      }

      /* In-Form WhatsApp AutoFill Box */
      .autofill-card {
        background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
        border: 2px solid #ec4899;
        border-radius: 12px;
        padding: 16px 20px;
        color: #fff;
        margin-bottom: 8px;
        box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15);
      }

      .autofill-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .autofill-title {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #f472b6;
      }

      .autofill-textarea {
        width: 100%;
        box-sizing: border-box;
        height: 100px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #fff;
        padding: 10px 14px;
        font-family: monospace;
        font-size: 13px;
        outline: none;
        resize: vertical;
      }

      .autofill-textarea:focus {
        border-color: #ec4899;
        background: rgba(255, 255, 255, 0.12);
      }

      .autofill-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }

      .btn-parse-fill {
        background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 22px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.2s;
        box-shadow: 0 4px 14px rgba(236, 72, 153, 0.4);
      }

      .btn-parse-fill:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(236, 72, 153, 0.5);
      }

      .parse-status {
        font-size: 13px;
        font-weight: 600;
        color: #34d399;
      }

      /* Custom widget styling */
      .widget-box {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
      }

      .widget-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .widget-input {
        flex: 1;
        padding: 12px 16px;
        font-size: 15px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        outline: none;
        font-family: inherit;
        background: #fff;
        transition: border-color 0.2s;
      }

      .widget-input:focus {
        border-color: #ec4899;
      }

      .badge-indicator {
        font-size: 12px;
        font-weight: 700;
        padding: 8px 14px;
        border-radius: 6px;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }

      .badge-idle { background: #f1f5f9; color: #64748b; }
      .badge-available { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
      .badge-taken { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
      .badge-loading { background: #fef3c7; color: #d97706; }

      .hash-status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #475569;
        background: #fdf2f8;
        border: 1px dashed #f472b6;
        padding: 8px 12px;
        border-radius: 6px;
      }

      .hash-code {
        font-family: monospace;
        font-weight: 700;
        color: #db2777;
        font-size: 14px;
      }

      /* Multi-Photo Uploader & Reordering Grid */
      .multi-photo-container {
        background: #ffffff;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        padding: 16px;
        margin-top: 6px;
      }

      .multi-photo-dropzone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        border-radius: 8px;
        border: 1px dashed #94a3b8;
        cursor: pointer;
        text-align: center;
        transition: background 0.2s, border-color 0.2s;
      }

      .multi-photo-dropzone:hover {
        background: #fdf2f8;
        border-color: #ec4899;
      }

      .multi-photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .photo-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .photo-card-img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        background: #f1f5f9;
      }

      .photo-card-badge {
        position: absolute;
        top: 6px;
        left: 6px;
        background: rgba(15, 23, 42, 0.75);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
      }

      .photo-card-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px;
        background: #f8fafc;
        border-top: 1px solid #e2e8f0;
      }

      .btn-arrow {
        background: #e2e8f0;
        border: none;
        border-radius: 4px;
        width: 26px;
        height: 24px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-arrow:hover:not(:disabled) {
        background: #cbd5e1;
      }

      .btn-arrow:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .btn-remove-photo {
        background: #fee2e2;
        color: #ef4444;
        border: none;
        border-radius: 4px;
        width: 24px;
        height: 24px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Netlify CMS (Matching Blog Engine) -->
    <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/netlify-cms.js"></script>

    <script>
      // 1. PIN Hashing algorithm matching birthday-star
      function generatePinHash(val) {
        if (!val) return '';
        var hash = 0;
        var str = String(val).trim();
        for (var i = 0; i < str.length; i++) {
          var char = str.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash;
        }
        return 'h_' + Math.abs(hash).toString(36);
      }

      // 2. Slug availability verification cache
      var existingSlugs = new Set(["birthday-sample", "kiran"]);
      fetch('/slugs.json')
        .then(function(r) { return r.json(); })
        .then(function(list) {
          if (Array.isArray(list)) list.forEach(function(s) { existingSlugs.add(s.toLowerCase()); });
        })
        .catch(function() {});

      // 3. Custom In-Form "whatsapp_autofill_box" Widget (Embedded right in the form!)
      var WhatsAppAutoFillControl = createClass({
        getInitialState: function() {
          return { status: '', text: this.props.value || '' };
        },
        handleTextChange: function(e) {
          this.setState({ text: e.target.value });
          this.props.onChange(e.target.value);
        },
        handleAutoFill: function() {
          var parsed = parseWhatsAppOrder(this.state.text);
          var filledCount = 0;

          // 1. Fill Slug
          if (parsed.slug_name) {
            var slugEl = document.querySelector('input[id*="slug_name"]');
            if (slugEl) { setNativeInputValue(slugEl, parsed.slug_name); filledCount++; }
          }

          // 2. Fill Birthday Person
          if (parsed.birthday_name) {
            var bNameEl = document.querySelector('input[id*="birthday_name"]');
            if (bNameEl) { setNativeInputValue(bNameEl, parsed.birthday_name); filledCount++; }
          }

          // 3. Fill Sender Name
          if (parsed.sender_name) {
            var senderEl = document.querySelector('input[id*="sender_name"]');
            if (senderEl) { setNativeInputValue(senderEl, parsed.sender_name); filledCount++; }
          }

          // 4. Fill Date of Birth
          if (parsed.birth_date) {
            var dateEl = document.querySelector('input[id*="birth_date"]');
            if (dateEl) { setNativeInputValue(dateEl, parsed.birth_date); filledCount++; }
          }

          // 5. Fill PIN
          if (parsed.pin_code) {
            var pinEl = document.querySelector('input[id*="pin_code"]');
            if (pinEl) { setNativeInputValue(pinEl, parsed.pin_code); filledCount++; }
          }

          // 6. Fill Balloon Messages 1 to 6
          if (parsed.balloons && parsed.balloons.length > 0) {
            for (var bi = 0; bi < parsed.balloons.length; bi++) {
              var idx = bi + 1;
              var bEl = document.querySelector('input[id*="balloon_' + idx + '"]');
              if (bEl) {
                setNativeInputValue(bEl, parsed.balloons[bi]);
                filledCount++;
              }
            }
          }

          // 7. Fill Main Letter
          if (parsed.letter) {
            var letterEl = document.querySelector('textarea[id*="letter"]');
            if (letterEl) { setNativeInputValue(letterEl, parsed.letter); filledCount++; }
          }

          if (filledCount > 0) {
            this.setState({ status: '✓ Successfully auto-filled ' + filledCount + ' fields below!' });
          } else {
            this.setState({ status: 'Could not find fields to parse. Please check WhatsApp message format.' });
          }
        },
        render: function() {
          var self = this;
          return h('div', { className: 'autofill-card' },
            h('div', { className: 'autofill-header' },
              h('div', { className: 'autofill-title' }, '⚡ 1-Click WhatsApp Order Auto-Fill')
            ),
            h('textarea', {
              className: 'autofill-textarea',
              value: this.state.text,
              placeholder: 'Paste the WhatsApp order message here (e.g. *Birthday Person:* Roja, *Date of Birth:* 2026-09-18, *Secret PIN:* 1234567, 6 Balloon messages, Main wish message)...',
              onChange: this.handleTextChange
            }),
            h('div', { className: 'autofill-actions' },
              h('button', {
                type: 'button',
                className: 'btn-parse-fill',
                onClick: this.handleAutoFill
              }, '✨ Auto-Fill Form Fields Below'),
              self.state.status ? h('span', { className: 'parse-status' }, self.state.status) : null
            )
          );
        }
      });

      CMS.registerWidget('whatsapp_autofill_box', WhatsAppAutoFillControl);

      // 4. Custom In-Form "slug_checker" Widget
      var SlugCheckerControl = createClass({
        getInitialState: function() {
          return {
            status: 'idle',
            message: 'Check Availability'
          };
        },
        handleChange: function(e) {
          var self = this;
          var val = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
          this.props.onChange(val);

          if (!val) {
            this.setState({ status: 'idle', message: 'Enter slug' });
            return;
          }

          if (existingSlugs.has(val)) {
            this.setState({ status: 'taken', message: '✕ Taken (file exists)' });
            return;
          }

          this.setState({ status: 'loading', message: 'Checking...' });

          clearTimeout(this._timer);
          this._timer = setTimeout(function() {
            var url = 'https://api.github.com/repos/srikanth1815101/wishes/contents/content/wishes/' + val + '.md';
            fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
              .then(function(res) {
                if (res.status === 200) {
                  existingSlugs.add(val);
                  self.setState({ status: 'taken', message: '✕ URL Taken (in wishes folder)' });
                } else {
                  self.setState({ status: 'available', message: '✓ URL Available!' });
                }
              })
              .catch(function() {
                var isAvail = !existingSlugs.has(val);
                self.setState({
                  status: isAvail ? 'available' : 'taken',
                  message: isAvail ? '✓ Available' : '✕ Taken'
                });
              });
          }, 350);
        },
        render: function() {
          var val = this.props.value || '';
          var statusClass = 'badge-idle';
          if (this.state.status === 'available') statusClass = 'badge-available';
          if (this.state.status === 'taken') statusClass = 'badge-taken';
          if (this.state.status === 'loading') statusClass = 'badge-loading';

          return h('div', { className: 'widget-box' },
            h('div', { className: 'widget-row' },
              h('input', {
                type: 'text',
                id: this.props.forID,
                className: 'widget-input',
                value: val,
                placeholder: 'e.g. rahul, kiran',
                onChange: this.handleChange
              }),
              h('span', { className: 'badge-indicator ' + statusClass }, this.state.message)
            ),
            val ? h('div', { style: { fontSize: '13px', color: '#64748b' } },
              'Page will publish at: ',
              h('strong', { style: { color: '#0f172a' } }, 'https://wishes.csrgo.com/' + val + '/')
            ) : null
          );
        }
      });

      CMS.registerWidget('slug_checker', SlugCheckerControl);

      // 5. Custom Single "pin_hasher" Widget:
      var PinHasherControl = createClass({
        handleChange: function(e) {
          var val = e.target.value.trim();
          this.props.onChange(val);
        },
        render: function() {
          var val = this.props.value || '';
          var computedHash = generatePinHash(val);

          return h('div', { className: 'widget-box' },
            h('div', { className: 'widget-row' },
              h('input', {
                type: 'text',
                id: this.props.forID,
                className: 'widget-input',
                value: val,
                placeholder: 'e.g. 1234567',
                onChange: this.handleChange
              })
            ),
            computedHash ? h('div', { className: 'hash-status-row' },
              '🔒 Encrypted PIN Hash to be saved in MD: ',
              h('span', { className: 'hash-code' }, computedHash)
            ) : null
          );
        }
      });

      CMS.registerWidget('pin_hasher', PinHasherControl);

      // 6. Custom Multi-Photo Uploader Widget with 6-Photo Batch Upload & Reordering
      var MultiPhotoControl = createClass({
        getInitialState: function() {
          var initialList = [];
          try {
            if (this.props.value) {
              initialList = typeof this.props.value === 'string' ? JSON.parse(this.props.value) : this.props.value;
            }
          } catch(e) {}
          return { photos: Array.isArray(initialList) ? initialList : [] };
        },

        handleFileSelect: function(e) {
          var self = this;
          var files = Array.from(e.target.files);
          if (!files.length) return;

          var readers = files.map(function(file) {
            return new Promise(function(resolve) {
              var reader = new FileReader();
              reader.onload = function(evt) {
                resolve({ name: file.name, url: evt.target.result });
              };
              reader.readAsDataURL(file);
            });
          });

          Promise.all(readers).then(function(newPhotos) {
            var combined = self.state.photos.concat(newPhotos.map(function(p) { return p.url; }));
            if (combined.length > 6) combined = combined.slice(0, 6);
            self.updatePhotos(combined);
          });
        },

        movePhoto: function(index, direction) {
          var newPhotos = this.state.photos.slice();
          var targetIndex = index + direction;
          if (targetIndex < 0 || targetIndex >= newPhotos.length) return;
          var temp = newPhotos[index];
          newPhotos[index] = newPhotos[targetIndex];
          newPhotos[targetIndex] = temp;
          this.updatePhotos(newPhotos);
        },

        removePhoto: function(index) {
          var newPhotos = this.state.photos.slice();
          newPhotos.splice(index, 1);
          this.updatePhotos(newPhotos);
        },

        updatePhotos: function(photos) {
          this.setState({ photos: photos });
          this.props.onChange(photos);
        },

        render: function() {
          var self = this;
          var photos = this.state.photos || [];

          return h('div', { className: 'multi-photo-container' },
            h('label', { className: 'multi-photo-dropzone' },
              h('span', { style: { fontSize: '28px', marginBottom: '6px' } }, '📷'),
              h('strong', { style: { color: '#0f172a', fontSize: '14px' } },
                photos.length >= 6 ? 'All 6 Photos Selected (Reorder Below)' : 'Click to Upload Photos (Select up to 6 at once)'
              ),
              h('span', { style: { color: '#64748b', fontSize: '12px', marginTop: '4px' } },
                'Currently: ' + photos.length + '/6 photos selected. Use arrows below to change photo order.'
              ),
              h('input', {
                type: 'file',
                multiple: true,
                accept: 'image/*',
                style: { display: 'none' },
                onChange: this.handleFileSelect
              })
            ),

            photos.length > 0 ? h('div', { className: 'multi-photo-grid' },
              photos.map(function(photoUrl, idx) {
                return h('div', { key: idx, className: 'photo-card' },
                  h('span', { className: 'photo-card-badge' }, 'Photo ' + (idx + 1)),
                  h('img', { src: photoUrl, className: 'photo-card-img', alt: 'Photo ' + (idx + 1) }),
                  h('div', { className: 'photo-card-actions' },
                    h('button', {
                      type: 'button',
                      className: 'btn-arrow',
                      disabled: idx === 0,
                      onClick: function() { self.movePhoto(idx, -1); },
                      title: 'Move Left'
                    }, '◀'),
                    h('button', {
                      type: 'button',
                      className: 'btn-remove-photo',
                      onClick: function() { self.removePhoto(idx); },
                      title: 'Remove'
                    }, '✕'),
                    h('button', {
                      type: 'button',
                      className: 'btn-arrow',
                      disabled: idx === photos.length - 1,
                      onClick: function() { self.movePhoto(idx, 1); },
                      title: 'Move Right'
                    }, '▶')
                  )
                );
              })
            ) : null
          );
        }
      });

      CMS.registerWidget('multi_photo_uploader', MultiPhotoControl);

      // 7. PreSave Hook: Cleanly inject computed frontmatter
      CMS.registerEventListener({
        name: 'preSave',
        handler: function(data) {
          var entry = data.entry;
          var slug = entry.getIn(['data', 'slug_name']);
          var pinCode = entry.getIn(['data', 'pin_code']);
          var photosData = entry.getIn(['data', 'photos_data']);
          var updates = {};

          if (slug) {
            var cleanSlug = String(slug).toLowerCase().trim().replace(/^\/+|\/+$/g, '');
            updates.url = '/' + cleanSlug + '/';
          }

          if (pinCode) {
            updates.pin_hash = generatePinHash(pinCode);
          }

          if (photosData) {
            var pList = photosData.toJS ? photosData.toJS() : photosData;
            if (Array.isArray(pList) && pList.length > 0) {
              updates.photos = pList;
            }
          }

          var balloonList = [];
          for (var b = 1; b <= 6; b++) {
            var balloonVal = entry.getIn(['data', 'balloon_' + b]);
            if (balloonVal) {
              balloonList.push(balloonVal);
            }
          }
          if (balloonList.length > 0) {
            updates.balloons = balloonList;
          }

          if (Object.keys(updates).length > 0) {
            return entry.get('data').merge(updates);
          }
          return entry.get('data');
        }
      });

      // 8. WhatsApp Order Parsing function
      function parseWhatsAppOrder(text) {
        var result = {};
        if (!text) return result;

        var nameMatch = text.match(/\*?Birthday Person:?\*?\s*([^\n\r]+)/i);
        if (nameMatch) {
          result.birthday_name = nameMatch[1].trim();
          result.slug_name = result.birthday_name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
        }

        var dobMatch = text.match(/\*?Date of Birth:?\*?\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/i);
        if (dobMatch) {
          result.birth_date = dobMatch[1].trim();
        }

        var senderMatch = text.match(/\*?Ordered By:?\*?\s*([^\n\r]+)/i);
        if (senderMatch) {
          result.sender_name = senderMatch[1].trim();
        }

        var pinMatch = text.match(/\*?Secret PIN:?\*?\s*([0-9a-zA-Z]+)/i);
        if (pinMatch) {
          result.pin_code = pinMatch[1].trim();
        }

        result.balloons = [];
        for (var i = 1; i <= 6; i++) {
          var balloonRegex = new RegExp('(?:^|\\n)\\s*' + i + '\\.\\s*([^\\n\\r]+)', 'i');
          var bMatch = text.match(balloonRegex);
          if (bMatch) {
            result.balloons.push(bMatch[1].trim());
          }
        }

        var wishMatch = text.match(/\*?Main Wish Message:?\*?\s*([\s\S]*?)(?:-{3,}|\*Amount|$)/i);
        if (wishMatch) {
          result.letter = wishMatch[1].trim();
        }

        return result;
      }

      function setNativeInputValue(el, value) {
        if (!el) return;
        var prototype = Object.getPrototypeOf(el);
        var descriptor = Object.getOwnPropertyDescriptor(prototype, 'value');
        if (descriptor && descriptor.set) {
          descriptor.set.call(el, value);
        } else {
          el.value = value;
        }
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }

      // 9. Netlify Identity handling
      window.CMS_MANUAL_INIT = true;

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user) {
            window.netlifyIdentity.on("login", function() {
              document.location.reload();
            });
          }
        });
        window.netlifyIdentity.init();
      }

      // Start CMS
      CMS.init();
    </script>
  </body>
</html>
