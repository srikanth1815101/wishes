<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3ea" />
    <title>For Our Little Star</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./index.css" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Caveat"', 'cursive'],
              body: ['"Quicksand"', 'sans-serif'],
              script: ['"Dancing Script"', 'cursive'],
            },
            colors: {
              cream: {
                50: '#fffaf6',
                100: '#fff3ea',
                200: '#ffe6d4',
                300: '#ffd2b3',
              },
              rose: {
                400: '#ff8fa3',
                500: '#ff6b8a',
                600: '#e84d72',
              },
              sky: {
                400: '#7ec8e3',
                500: '#5bb4d6',
              },
              mint: {
                400: '#a8e6cf',
                500: '#7fd1b6',
              },
              sun: {
                400: '#ffd56b',
                500: '#ffbe3d',
              },
              ink: {
                700: '#5a4a52',
                800: '#43353f',
                900: '#2d2228',
              },
            },
          },
        },
      }
    </script>
  </head>
  <body class="bg-[#fff3ea] text-[#2d2228] select-none">
    <!-- Permanent Background Gradient -->
    <div class="fixed inset-0 z-0 pointer-events-none" style="background: linear-gradient(160deg, #fff3ea 0%, #ffe6d4 50%, #ffd2b3 100%);"></div>

    <!-- Permanent Floating Decor (Scatter along outer edges) -->
    <div class="pointer-events-none fixed inset-0 z-[1] overflow-hidden">
      <!-- Left Edge Decor -->
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:4%; top:6%; animation-delay:0s; animation-duration:5s;">🩷</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:10%; top:22%; animation-delay:1.2s; animation-duration:6s;">✨</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:5%; top:48%; animation-delay:0.4s; animation-duration:4.5s;">🎈</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:12%; top:72%; animation-delay:1.8s; animation-duration:5.5s;">⭐</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:6%; top:90%; animation-delay:0.9s; animation-duration:6.5s;">🌸</div>

      <!-- Right Edge Decor -->
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:92%; top:8%; animation-delay:1.5s; animation-duration:5.2s;">🎈</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:85%; top:24%; animation-delay:0.3s; animation-duration:6.2s;">🩷</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:94%; top:50%; animation-delay:2.1s; animation-duration:4.8s;">✨</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:86%; top:74%; animation-delay:0.7s; animation-duration:5.8s;">🌸</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:91%; top:88%; animation-delay:1.4s; animation-duration:6.4s;">⭐</div>

      <!-- Top & Bottom Edge Accents -->
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:28%; top:4%; animation-delay:2.0s; animation-duration:5.0s;">🌸</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:72%; top:5%; animation-delay:0.6s; animation-duration:5.6s;">✨</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:30%; top:93%; animation-delay:1.1s; animation-duration:6.1s;">✨</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:70%; top:92%; animation-delay:2.3s; animation-duration:4.9s;">🩷</div>
    </div>

    <div id="app" class="relative z-10 min-h-[100dvh] w-full overflow-x-hidden bg-transparent"></div>

    <!-- Application scripts -->
    <script src="./content.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
