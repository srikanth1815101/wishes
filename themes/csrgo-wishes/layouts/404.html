{{ define "main" }}
<main class="mx-auto max-w-4xl px-4 py-28 text-center sm:px-6 lg:px-8">
  <div class="inline-flex h-20 w-20 items-center justify-center rounded-3xl bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400 mb-6 shadow-inner">
    <svg class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
  </div>
  <h1 class="font-display text-4xl font-black text-ink-900 dark:text-white sm:text-5xl">404 — Page Not Found</h1>
  <p class="mt-4 text-base text-ink-600 dark:text-gray-300 max-w-md mx-auto">
    The page or wish site you are looking for doesn't exist or has moved.
  </p>
  <div class="mt-8 flex justify-center gap-4">
    <a href="/" class="rounded-xl bg-purple-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-purple-500/25 hover:bg-purple-700 transition">
      Back to Home
    </a>
  </div>
</main>
{{ end }}
