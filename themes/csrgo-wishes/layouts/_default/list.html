{{ define "main" }}
<main class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">
  <h1 class="font-display text-3xl font-semibold text-ink-900">{{ .Title }}</h1>
  <div class="mt-6 space-y-4">
    {{ range .Pages }}
      <div class="rounded-2xl border border-ink-200 bg-white p-5 shadow-sm">
        <a href="{{ .RelPermalink }}" class="font-display text-xl font-semibold text-ink-900 hover:text-gold-600">{{ .Title }}</a>
        <p class="mt-2 text-sm text-ink-600">{{ .Summary }}</p>
      </div>
    {{ end }}
  </div>
</main>
{{ end }}
