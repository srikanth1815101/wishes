{{ define "main" }}
<main class="bg-slate-50 dark:bg-gray-900 min-h-screen pt-28 pb-16">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Breadcrumb -->
    <nav class="mb-8 flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
      <a href="/" class="hover:text-purple-600 dark:hover:text-purple-400 transition-colors">Home</a>
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      <span class="text-gray-700 dark:text-gray-200 font-medium">{{ .Title }}</span>
    </nav>

    <!-- Page Header -->
    <div class="relative mb-10 overflow-hidden rounded-3xl bg-gradient-to-br from-purple-600 via-blue-600 to-indigo-700 px-8 py-12 text-white shadow-xl shadow-purple-500/20">
      <div class="pointer-events-none absolute -right-16 -top-16 h-64 w-64 rounded-full bg-white/5 blur-3xl"></div>
      <div class="pointer-events-none absolute -bottom-16 -left-10 h-48 w-48 rounded-full bg-indigo-400/10 blur-3xl"></div>
      <div class="relative">
        <div class="inline-flex items-center gap-2 rounded-full bg-white/15 px-4 py-1.5 text-xs font-semibold uppercase tracking-widest backdrop-blur mb-4">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          Legal Document
        </div>
        <h1 class="font-display text-3xl sm:text-4xl font-bold leading-tight mb-3">{{ .Title }}</h1>
        {{ with .Params.description }}
          <p class="text-white/80 text-base max-w-xl">{{ . }}</p>
        {{ end }}
        {{ with .Date }}
          <p class="mt-4 text-xs text-white/60">Last updated: {{ .Format "2 January 2006" }}</p>
        {{ end }}
      </div>
    </div>

    <!-- Content Card -->
    <div class="rounded-3xl border border-gray-200/80 dark:border-gray-700/60 bg-white dark:bg-gray-800 shadow-sm px-8 py-10">
      <div class="prose prose-slate dark:prose-invert max-w-none
        prose-headings:font-display prose-headings:text-gray-900 dark:prose-headings:text-white
        prose-h2:text-xl prose-h2:font-semibold prose-h2:mt-10 prose-h2:mb-4 prose-h2:border-b prose-h2:border-gray-100 dark:prose-h2:border-gray-700 prose-h2:pb-2
        prose-h3:text-base prose-h3:font-semibold prose-h3:text-purple-700 dark:prose-h3:text-purple-400 prose-h3:mt-6 prose-h3:mb-2
        prose-p:text-gray-600 dark:prose-p:text-gray-300 prose-p:leading-relaxed prose-p:text-[15px]
        prose-li:text-gray-600 dark:prose-li:text-gray-300 prose-li:text-[15px]
        prose-a:text-purple-600 dark:prose-a:text-purple-400 prose-a:no-underline hover:prose-a:underline
        prose-strong:text-gray-800 dark:prose-strong:text-white
        prose-table:text-sm prose-th:text-gray-700 dark:prose-th:text-gray-200 prose-td:text-gray-600 dark:prose-td:text-gray-300
        prose-hr:border-gray-200 dark:prose-hr:border-gray-700">
        {{ .Content }}
      </div>
    </div>

  </div>
</main>
{{ end }}
