<div class="mx-auto max-w-xl">
  <div class="relative">
    <div id="search-box-container" class="flex items-center gap-2.5 rounded-2xl border border-gray-200/80 dark:border-gray-700/80 bg-white/90 dark:bg-gray-800/90 px-4 py-3.5 shadow-xl shadow-purple-500/5 dark:shadow-purple-500/10 backdrop-blur-xl transition-all duration-300 focus-within:border-purple-500 focus-within:ring-2 focus-within:ring-purple-500/20">
      <svg class="h-5 w-5 shrink-0 text-gray-400 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input
        type="text"
        id="search-input"
        inputmode="search"
        placeholder="Search templates, categories, tags…"
        class="w-full bg-transparent text-[15px] font-medium text-gray-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:outline-none"
      />
      <button
        type="button"
        id="search-clear-btn"
        style="display: none;"
        class="shrink-0 rounded-full p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-gray-700 dark:hover:text-gray-200 transition"
        aria-label="Clear search"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
</div>
