<div class="flex flex-col gap-4">
    <a href="/" class="flex items-center justify-center md:justify-start gap-1 group">
        <img src="/logo.png" alt="{{ .Site.Params.brandName | default "CSRGO Wishes" }}"
            class="h-10 w-10 object-contain transition-transform duration-200 group-hover:scale-105 leading-none pb-1 filter brightness-0 invert"
            style="max-width: 44px; min-width: 36px;" />
        <span class="mx-1 h-7 border-l border-gray-400 dark:border-gray-300 inline-block relative -mt-1"></span>
        <span class="text-4xl font-extrabold text-white select-none leading-none pb-1">{{ .Site.Params.brandName | default "CSRGO Wishes" }}</span>
    </a>
    <p class="text-gray-300 text-sm max-w-md mx-auto md:mx-0">{{ .Site.Params.description }}</p>
</div>
