<div id="filter-sheet" class="fixed inset-0 z-50 flex items-end sm:items-center sm:justify-center" style="display: none;">
  <div class="close-filter-btn absolute inset-0 bg-ink-950/50 backdrop-blur-sm animate-fade-up" style="background-color: rgba(8,11,20,0.5); backdrop-filter: blur(4px);"></div>
  <div class="relative z-10 w-full max-w-md rounded-t-3xl bg-white p-5 shadow-2xl animate-slide-up sm:rounded-3xl sm:animate-scale-in">
    <div class="flex items-center justify-between">
      <h3 class="font-display text-lg font-semibold text-ink-900">Filter</h3>
      <button type="button" class="close-filter-btn rounded-full p-2 text-ink-500 hover:bg-ink-100">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="mt-5 mb-2 text-xs font-semibold uppercase tracking-wide text-ink-500">
      Category
    </p>
    <div id="filter-categories-container" class="flex flex-wrap gap-2">
      <button type="button" data-category="All" class="cat-btn close-filter-btn rounded-full px-4 py-2 text-sm font-medium transition bg-ink-900 text-white">
        All
      </button>
    </div>
    <button
      type="button"
      class="close-filter-btn mt-6 w-full rounded-2xl bg-ink-900 py-3 text-sm font-semibold text-white transition hover:bg-ink-800"
    >
      Show results
    </button>
  </div>
</div>
