<section class="relative isolate overflow-hidden bg-gradient-to-b from-slate-50 via-purple-50/30 to-slate-50 dark:from-[#0A0E27] dark:via-gray-900 dark:to-[#0A0E27] transition-colors duration-300">

        <span class="bg-gradient-to-r from-purple-600 via-blue-600 to-pink-600 bg-clip-text text-transparent">

      <!-- Description -->
      <p class="mt-4 text-base leading-relaxed text-gray-600 dark:text-gray-300 sm:text-lg max-w-xl mx-auto">

      <!-- Search Bar Component -->
      <div class="mx-auto mt-8 max-w-xl">

              id="search-input"

              id="search-clear-btn"
              style="display: none;"
