<section class="relative isolate overflow-hidden bg-gradient-to-b from-ink-950 via-ink-900 to-ink-950">
  <div class="pointer-events-none absolute inset-0 opacity-50">
    <div class="absolute -left-20 top-10 h-72 w-72 rounded-full bg-gold-500/25 blur-3xl"></div>
    <div class="absolute right-0 top-32 h-80 w-80 rounded-full bg-brand-600/25 blur-3xl"></div>
  </div>
  <div class="relative mx-auto max-w-7xl px-4 py-16 sm:px-6 sm:py-20 lg:px-8 lg:py-28">
    <div class="mx-auto max-w-2xl text-center">
      <span class="inline-flex items-center gap-1.5 rounded-full border border-gold-400/30 bg-gold-400/10 px-3.5 py-1.5 text-xs font-medium text-gold-200">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/></svg>
        Premium wishes websites, built for you
      </span>
      <h1 class="mt-5 font-display text-4xl font-semibold leading-[1.1] text-white text-balance sm:text-5xl lg:text-6xl">
        Beautiful wish sites for every special moment
      </h1>
      <p class="mt-4 text-base leading-relaxed text-ink-300 sm:text-lg">
        Pick a design, share your details, and we craft a permanent custom wish website with its own shareable link — ready in 48 hours.
      </p>

      <!-- Search Bar Component -->
      <div class="mx-auto mt-7 max-w-xl">
        <div class="relative">
          <div id="search-box-container" class="flex items-center gap-2 rounded-2xl border border-ink-200 bg-white px-4 py-3 shadow-card transition-all duration-300">
            <svg class="h-5 w-5 shrink-0 text-ink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input
              type="text"
              id="search-input"
              inputmode="search"
              placeholder="Search templates, categories, tags…"
              class="w-full bg-transparent text-[15px] text-ink-900 placeholder:text-ink-400 focus:outline-none"
            />
            <button
              type="button"
              id="search-clear-btn"
              style="display: none;"
              class="shrink-0 rounded-full p-1 text-ink-400 transition hover:bg-ink-100 hover:text-ink-700"
              aria-label="Clear search"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
            <button
              type="button"
              class="open-filter-btn shrink-0 rounded-xl border border-ink-200 p-2 text-ink-600 transition hover:border-gold-300 hover:text-gold-600"
              aria-label="Filters"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-5 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-xs text-ink-400">
        <span class="flex items-center gap-1.5">
          <svg class="h-3.5 w-3.5 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          48-hour delivery
        </span>
        <span class="flex items-center gap-1.5">
          <svg class="h-3.5 w-3.5 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Permanent URL
        </span>
        <span class="flex items-center gap-1.5">
          <svg class="h-3.5 w-3.5 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          WhatsApp ordering
        </span>
      </div>
    </div>
  </div>
</section>
