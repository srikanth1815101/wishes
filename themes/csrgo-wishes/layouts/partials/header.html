<header class="sticky top-0 z-40 border-b border-ink-100 bg-ink-50/80 backdrop-blur-lg">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    <a href="/" class="flex items-center gap-2.5">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-ink-900 shadow-card">
        <svg class="h-5 w-5 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/></svg>
      </span>
      <div class="leading-none">
        <p class="font-display text-base font-semibold text-ink-900">
          {{ .Site.Params.brandName }}
        </p>
        <p class="text-[11px] text-ink-500">{{ .Site.Params.brandDomain }}</p>
      </div>
    </a>
    <div class="hidden items-center gap-6 sm:flex">
      <a href="#templates" class="text-sm font-medium text-ink-600 transition hover:text-ink-900">
        Templates
      </a>
      <a href="#how" class="text-sm font-medium text-ink-600 transition hover:text-ink-900">
        How it works
      </a>
      <a
        href="#templates"
        class="rounded-xl bg-ink-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-ink-800"
      >
        Browse Designs
      </a>
    </div>
    <button
      type="button"
      class="open-filter-btn rounded-xl border border-ink-200 bg-white p-2 text-ink-600 shadow-sm transition hover:border-gold-300 sm:hidden"
      aria-label="Search"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </div>
</header>
