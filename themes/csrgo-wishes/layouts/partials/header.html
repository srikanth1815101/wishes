<header class="fixed top-2 sm:top-4 left-2 sm:left-4 right-2 sm:right-4 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto">
        <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-xl border border-gray-200/50 dark:border-gray-600/50 rounded-xl sm:rounded-2xl px-4 sm:px-6 py-3 sm:py-4 shadow-lg shadow-purple-500/10 dark:shadow-purple-400/10 relative">
            <div class="flex justify-between items-center">
                <!-- Logo and Site Title -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <a href="/" class="flex items-center">
                        <div class="relative flex items-center justify-center p-1">
                            <img src="/logo.png" alt="{{ .Site.Params.brandName | default "CSRGO" }}" class="w-6 h-6 sm:w-8 sm:h-8 relative z-10" />
                        </div>

                        <!-- Separator -->
                        <div class="h-4 sm:h-6 w-px bg-gray-200 dark:bg-gray-700 mx-1.5 sm:mx-2 self-center"></div>

                        <!-- Brand Text -->
                        <div class="h-6 sm:h-8 flex items-center">
                            <span class="text-xl sm:text-3xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-blue-600 leading-none pt-0.5">
                                {{ .Site.Params.brandName | default "CSRGO Wishes" }}
                            </span>
                        </div>
                    </a>
                </div>

                <!-- Right Side Container (Nav + Actions) -->
                <div class="flex items-center space-x-4 sm:space-x-6">
                    <!-- Desktop Navigation -->
                    <div class="hidden md:flex gap-8 text-base font-medium">
                        {{ range .Site.Menus.main }}
                        <a href="{{ .URL }}"
                            class="relative py-2 px-2 transition text-gray-700 dark:text-gray-200 hover:text-blue-600 dark:hover:text-fuchsia-400 {{ if eq $.RelPermalink .URL }}font-bold text-blue-600 dark:text-fuchsia-400{{ end }}">
                            {{ .Name }}
                            <span class="absolute left-0 -bottom-1 w-full h-0.5 rounded bg-gradient-to-r from-blue-600 via-fuchsia-500 to-pink-500 transition-all duration-300 scale-x-0 origin-left {{ if eq $.RelPermalink .URL }}scale-x-100{{ end }}"></span>
                        </a>
                        {{ end }}
                    </div>

                    <!-- Right Actions -->
                    <div class="flex items-center space-x-1 sm:space-x-2">
                        <!-- Theme Toggle Button -->
                        <button onclick="toggleTheme()"
                            class="p-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-600 dark:text-gray-200 dark:hover:bg-gray-800 dark:hover:text-fuchsia-400 transition-colors duration-200"
                            aria-label="Toggle theme">
                            <span id="theme-icon-container" class="block">
                                <svg id="theme-icon-sun" class="w-6 h-6 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                                <svg id="theme-icon-moon" class="w-6 h-6 block dark:hidden text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                            </span>
                        </button>

                        <!-- Mobile Menu Button -->
                        <button id="mobile-menu-btn" onclick="toggleMobileMenu(event)"
                            class="md:hidden p-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-600 dark:text-gray-200 dark:hover:bg-gray-800 dark:hover:text-fuchsia-400 transition-colors duration-200"
                            aria-label="Toggle menu">
                            <svg class="w-6 h-6 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="4" x2="20" y1="12" y2="12"/>
                                <line x1="4" x2="20" y1="6" y2="6"/>
                                <line x1="4" x2="20" y1="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mobile Navigation Dropdown -->
            <div id="mobile-menu"
                class="hidden md:hidden pt-4 mt-2 border-t border-gray-200/50 dark:border-gray-700/50 space-y-2">
                {{ range .Site.Menus.main }}
                <a href="{{ .URL }}"
                    class="block px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 {{ if eq $.RelPermalink .URL }}bg-gradient-to-r from-purple-50 to-blue-50 dark:from-purple-900/20 dark:to-blue-900/20 text-purple-700 dark:text-purple-300{{ else }}text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800/50{{ end }}">
                    <span>{{ .Name }}</span>
                </a>
                {{ end }}
            </div>
        </div>
    </div>
</header>
