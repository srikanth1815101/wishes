{{ define "main" }}
{{ partial "hero.html" . }}

<main class="mx-auto max-w-7xl px-4 pb-24 sm:px-6 lg:px-8">
  <div class="mt-12 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <svg class="h-5 w-5 fill-gold-400 text-gold-400" viewBox="0 0 24 24" fill="#c98a3a" stroke="#c98a3a" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
      </svg>
      <h2 class="font-display text-xl font-semibold text-ink-900 dark:text-white sm:text-2xl">
        Trending Wishes
      </h2>
    </div>
  </div>

  {{ partial "grid.html" . }}

  <!-- View All Templates CTA -->
  <div class="mt-12 text-center">
    <a href="/templates/" class="inline-flex items-center gap-2 rounded-2xl bg-gradient-to-r from-purple-600 via-blue-600 to-indigo-600 px-8 py-4 text-base font-bold text-white shadow-lg shadow-purple-500/25 transition hover:scale-[1.03] active:scale-95">
      <span>View All Templates</span>
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
</main>
{{ end }}
