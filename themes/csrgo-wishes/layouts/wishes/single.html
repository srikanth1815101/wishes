<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Happy Birthday {{ .Params.birthday_name | default "Star" }} — CSRGO Wishes</title>
    <meta name="description" content="A special birthday surprise for {{ .Params.birthday_name | default "you" }}" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts: Fredoka, Caveat, Quicksand, Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Dancing+Script:wght@500;600;700&family=Quicksand:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS & Tailwind -->
    <link rel="stylesheet" href="/templates/birthday-star/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Caveat"', 'cursive'],
              body: ['"Quicksand"', 'sans-serif'],
              script: ['"Dancing Script"', 'cursive'],
            },
            colors: {
              cream: { 50: '#fffaf6', 100: '#fff3ea', 200: '#ffe6d4', 300: '#ffd2b3' },
              rose: { 400: '#ff8fa3', 500: '#ff6b8a', 600: '#e84d72' },
              sky: { 400: '#7ec8e3', 500: '#5bb4d6' },
              mint: { 400: '#a8e6cf', 500: '#7fd1b6' },
              sun: { 400: '#ffd56b', 500: '#ffbe3d' },
              ink: { 700: '#5a4a52', 800: '#43353f', 900: '#2d2228' },
            },
          },
        },
      }
    </script>
  </head>
  <body class="bg-[#fff3ea] text-[#2d2228] select-none">
    <!-- Permanent Background Gradient -->
    <div class="fixed inset-0 z-0 pointer-events-none" style="background: linear-gradient(160deg, #fff3ea 0%, #ffe6d4 50%, #ffd2b3 100%);"></div>

    <!-- Permanent Floating Decor -->
    <div class="pointer-events-none fixed inset-0 z-[1] overflow-hidden">
      <!-- Left Edge Decor -->
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:4%; top:6%; animation-delay:0s; animation-duration:5s;">🩷</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:10%; top:22%; animation-delay:1.2s; animation-duration:6s;">✨</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:5%; top:48%; animation-delay:0.4s; animation-duration:4.5s;">🎈</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:12%; top:72%; animation-delay:1.8s; animation-duration:5.5s;">⭐</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:6%; top:90%; animation-delay:0.9s; animation-duration:6.5s;">🌸</div>

      <!-- Right Edge Decor -->
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:92%; top:8%; animation-delay:1.5s; animation-duration:5.2s;">🎈</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:85%; top:24%; animation-delay:0.3s; animation-duration:6.2s;">🩷</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:94%; top:50%; animation-delay:2.1s; animation-duration:4.8s;">✨</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:86%; top:74%; animation-delay:0.7s; animation-duration:5.8s;">🌸</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:91%; top:88%; animation-delay:1.4s; animation-duration:6.4s;">⭐</div>

      <!-- Top & Bottom Edge Accents -->
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:28%; top:4%; animation-delay:2.0s; animation-duration:5.0s;">🌸</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:72%; top:5%; animation-delay:0.6s; animation-duration:5.6s;">✨</div>
      <div class="absolute text-2xl opacity-45 animate-float-slow" style="left:30%; top:93%; animation-delay:1.1s; animation-duration:6.1s;">✨</div>
      <div class="absolute text-2xl opacity-45 animate-float-mid" style="left:70%; top:92%; animation-delay:2.3s; animation-duration:4.9s;">🩷</div>
    </div>

    <div id="app" class="relative z-10 min-h-[100dvh] w-full overflow-x-hidden bg-transparent"></div>

    <!-- Data Injection from Hugo Markdown Frontmatter -->
    <script>
      var birthdayName = JSON.parse({{ .Params.birthday_name | default "Birthday Star" | jsonify }});
      var senderName = JSON.parse({{ .Params.sender_name | default .Params.from_name | default "" | jsonify }});
      var BIRTHDAY_PIN = JSON.parse({{ .Params.pin_hash | default .Params.pin | default "h_11li87w" | jsonify }});
      var BIRTHDAY_TARGET_DATE = JSON.parse({{ .Params.birth_date | default "2026-07-28T00:00:00" | jsonify }});

      var welcomeMessage = {
        title: "A little surprise for " + birthdayName + "...",
        lines: []
      };

      var BALLOON_COLORS = ['#ff6b8a', '#ffbe3d', '#7fd1b6', '#5bb4d6', '#ff8fa3', '#ffd56b'];
      {{ with .Params.balloons }}
      var rawBalloons = JSON.parse({{ . | jsonify }});
      var balloons = rawBalloons.map(function(item, idx) {
        return {
          color: (item && typeof item === 'object' && item.color) ? item.color : BALLOON_COLORS[idx % BALLOON_COLORS.length],
          message: (typeof item === 'string') ? item : ((item && item.message) || '')
        };
      });
      {{ end }}

      {{ with .Params.photos }}
      {{ $total := len . }}
      var galleryPhotos = [
        {{ range $i, $p := . }}
        { src: {{ $p }} }{{ if ne (add $i 1) $total }},{{ end }}
        {{ end }}
      ];
      {{ end }}

      var daughterWish = null;
      var familyWishes = [];

      var rawLetter = JSON.parse({{ .Params.letter | default .Params.husband_letter | jsonify }});
      var letterText = (rawLetter && typeof rawLetter === 'object') ? (rawLetter.body || '') : (typeof rawLetter === 'string' ? rawLetter : '');

      var husbandLetter = {
        title: "A Special Birthday Wish for " + birthdayName,
        salutation: "Dearest " + birthdayName + ",",
        body: letterText || "Happy Birthday! May your special day be filled with warmth, laughter, and endless happiness.",
        signoff: "With lots of love,",
        signature: (senderName ? senderName : "Your Loved Ones") + " ❤️"
      };

      var finalWish = {
        title: "Happy Birthday " + birthdayName + "!",
        message: "May your day be filled with sweet surprises, delicious cake, and joyful moments. Today, tomorrow, and always — we celebrate you!",
        signoff: senderName ? ("With lots of love, " + senderName + " ❤️") : "With all our love, always"
      };
    </script>
    <script src="/templates/birthday-star/app.js?v={{ now.Unix }}"></script>
  </body>
</html>
