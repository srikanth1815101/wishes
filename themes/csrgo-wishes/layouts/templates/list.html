{{ define "main" }}
<main class="bg-slate-50 dark:bg-gray-900 min-h-screen pt-28 pb-24">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Breadcrumb -->
    {{ partial "breadcrumb.html" . }}

    <!-- Page Header -->
    {{ partial "page_header.html" . }}

    <!-- Search Bar -->
    <div class="mb-6">
      {{ partial "search_bar.html" . }}
    </div>

    <!-- Category Filter Bar -->
    {{ partial "categories.html" . }}

    <!-- Template Count & Title -->
    <div class="mt-8 flex items-center justify-between">
      <h2 id="active-category-title" class="font-display text-xl font-semibold text-ink-900 dark:text-white sm:text-2xl">
        All Templates
      </h2>
      <span id="template-count" class="text-sm text-ink-500">
        Loading…
      </span>
    </div>

    <!-- Template Grid -->
    {{ partial "grid.html" . }}

  </div>
</main>
{{ end }}
