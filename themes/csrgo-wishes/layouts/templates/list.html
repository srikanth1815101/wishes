{{ define "main" }}
<main class="mx-auto max-w-7xl px-4 pt-24 pb-20 sm:px-6 sm:pt-28 lg:px-8">

  <!-- Compact User-Friendly Header Row -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-200/60 dark:border-gray-800 pb-6">
    <div>
      <h1 class="font-black text-2xl sm:text-3xl text-gray-900 dark:text-white tracking-tight">
        Explore Templates
      </h1>
      <p class="mt-1 text-xs sm:text-sm text-gray-500 dark:text-gray-400 font-medium">
        Select an interactive template to personalize and generate your wish link.
      </p>
    </div>

    <!-- Compact Search Bar -->
    <div class="w-full md:w-80 shrink-0">
      {{ partial "search_bar.html" . }}
    </div>
  </div>

  <!-- Category Filter Bar -->
  <div class="pt-4">
    {{ partial "categories.html" . }}
  </div>

  <!-- Template Count & Title Header -->
  <div class="mt-6 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <svg class="h-4 w-4 text-purple-600 dark:text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <h2 id="active-category-title" class="font-display text-lg sm:text-xl font-extrabold text-gray-900 dark:text-white">
        All Templates
      </h2>
    </div>
    <span id="template-count" class="rounded-full bg-purple-100 dark:bg-purple-900/40 px-3 py-1 text-xs font-bold text-purple-700 dark:text-purple-300">
      Loading…
    </span>
  </div>

  <!-- Template Grid -->
  <div class="mt-4">
    {{ partial "grid.html" . }}
  </div>

</main>
{{ end }}
